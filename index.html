`},{id:12,cat:'hemat',priority:4,title:'Anemiler — MCV\'ye Göre Yaklaşım',tags:'anemi,MCV,demir,talasemi,B12,Fanconi,Mentzer,hemolitik,Coombs,RDW,ferritin',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>MCV</th><th>Nedenler</th></tr></thead>
<tbody>
<tr><td>↓ Mikrositer</td><td>Demir eksikliği (en sık!), Talasemi taşıyıcılığı, Kronik hastalık, Kurşun, Sideroblastik</td></tr>
<tr><td>Normal</td><td>Akut kan kaybı, Kronik hastalık, Hemolitik, Lösemi</td></tr>
<tr><td>↑ Makrositer</td><td>B12, Folat, Aplastik anemi (Fanconi), Hipotiroidi, İlaç (MTX, valproat)</td></tr>
</tbody>
</table></div>
<p><strong>Demir Eksikliği vs Talasemi Taşıyıcılığı:</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Parametre</th><th>Demir Eksikliği</th><th>Talasemi Taşıyıcı</th></tr></thead>
<tbody>
<tr><td><strong>RDW</strong></td><td><em>ÇOK YÜKSEK!</em></td><td>Normal (en önemli fark!)</td></tr>
<tr><td>Ferritin</td><td>↓</td><td>Normal/↑</td></tr>
<tr><td>Mentzer (MCV/RBC)</td><td>&gt;13</td><td>&lt;13</td></tr>
<tr><td>Hb Elektroforezi</td><td>Normal</td><td>HbA2 &gt;3.5% → kesin tanı</td></tr>
</tbody>
</table></div>
<p><strong>Demir Tedavisi:</strong> 4-6 mg/kg/gün elementer Fe, açkarnına, C vitamini ile. Retikülositoz: 5-7. gün. Hb normalden <strong>3 AY DAHA</strong> devam.</p>
<p><strong>B12 Eksikliği (Erol!):</strong> Hipersegmente nötrofil PY'da. Homosistein↑ + MMA↑ (folattan farkı). Nörolojik: posterior kolon (vibrasyon kaybı). İmmerslund-Gräsbeck: B12 malabsorpsiyonu + proteinüri.</p>
<div class="danger-box"><strong>🎯 Erol Hoca Tüyosu (B12):</strong> Erol hoca yanıtı beklerken sesin çıkmamasına tahammülü yok! Cevabı <em>kesin ve yüksek sesle</em> söyle: <strong>"Hipersegmente nötrofil!"</strong> → sonra devam et: "MMA ve homosistein yükselir, folat eksikliğinden bunu ile ayırt ederiz." Tereddütlü, alçak sesli, "efendim böyle olabilir" tarzdaki cevap puan kırdırır. Emin ol, direkt söyle!</div>
<p><strong>Fanconi Aplastik Anemisi:</strong></p>
<ul>
<li>OR kalıtım, DNA onarım defekti. Pansitopeni + makrositoz + konjenital anomaliler</li>
<li>Anomaliler: Mikrosefali, BAŞPARMAKyok/radius yokluğu(!), café au lait, renal anomali, kısa boy</li>
<li>VSD + demir tedavisine yanıt yok + MCV yüksek → FANCONI düşün!</li>
<li>Tanı: DEB/MMC testi. Tedavi: Kİ nakli. MDS/AML riski %15-20</li>
</ul>
<p><strong>Otoimmün Hemolitik Anemi:</strong></p>
<ul>
<li>Direkt Coombs (DAT): Hastanın KENDİ eritrositleri → eritrosit yüzeyinde IgG/kompleman → AIHA</li>
<li>İndirekt Coombs (IAT): Serumdaki serbest antikorlar → cross-match</li>
<li>AIHA Lab: LDH↑, indirekt bilirubin↑, haptoglobin↓, Direkt Coombs(+). PY: sferositler (BLAST YOK!)</li>
</ul>
<h4 class="h-section">📋 Yaklaşım Algoritması</h4>
<ol class="content" style="padding-left:18px">
<li>Hemogram → MCV'ye göre sınıfla (mikro/normo/makro)</li>
<li>Mikrositer → Ferritin + RDW → Demir eks. (RDW yüksek) vs Talasemi taşıyıcı (RDW normal)</li>
<li>Normositer → Retikülosit sayısı → Yüksekse hemolitik/kanama, düşükse kemik iliği sorunu</li>
<li>Makrositer → B12 + Folat + Hipotiroidi + ilaç sorgula</li>
<li>Hemolitik → Direkt Coombs (DAT) → Pozitifse AIHA, negatifse non-immün (HÜS, orak, sferositoz)</li>
<li>Retikülosit düşük + pansitopeni → Kemik iliği biyopsisi (aplastik anemi, lösemi)</li>
</ol>
<div class="info-box"><strong>Mixt Anemi:</strong> Demir + B12 eksikliği birlikte → MCV YANLIŞlıkla normal görünür! Her ikisini de sorgula. Demir: Ferritin↓, RDW↑. B12: MMA↑, homosistein↑</div>
<h4 class="h-section">💊 Demir Tedavisi — Tam Detay</h4>
<ul>
<li>Elementer Fe <strong>4-6 mg/kg/gün</strong> oral, 2-3 doza böl</li>
<li>Açkarnına (ya da C vitamini ile); süt/çay/kalsiyum/antasit ile VERME</li>
<li>Retikülositoz: 5-7. gün (yanıt göstergesi)</li>
<li>Hb normalleşince <strong>3 AY DAHA</strong> devam (depo doldurmak için)</li>
<li>Yanıt yok → uyumu sorgula, emilim bozukluğu (çölyak), yanlış tanı (talasemi)</li>
</ul>
<div class="success-box"><strong>Kronik hastalık anemisi farkı:</strong> Ferritin YÜKSEK (reaktan!), serum Fe↓, TDBK↓. Altta yatan tedavi gerekli, rutin Fe VERİLMEZ</div>
`},{id:13,cat:'hemat',priority:3,title:'İTP — Yaklaşım + Lösemi Ayrımı + Tedavi',tags:'İTP,trombosit,lösemi,IVIG,steroid,purpura,megakaryosit,PY',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>İTP</th><th>Lösemi</th></tr></thead>
<tbody>
<tr><td>Genel durum</td><td>İyi/aktif</td><td>Kötü/halsiz</td></tr>
<tr><td>FM</td><td>Peteşi/purpura, HSM YOK, LAP YOK</td><td>HSM VAR, LAP VAR, kemik ağrısı</td></tr>
<tr><td>Hemogram</td><td>Plt çok↓, Hb+WBC NORMAL</td><td>Pansitopeni veya hiperlökositoz</td></tr>
<tr><td><strong>PY</strong></td><td><em>"BİR ŞEY GÖRMEZSİNİZ!"</em> (dev trombosit olabilir)</td><td>BLAST GÖRÜRSÜNÜZ</td></tr>
<tr><td>Kİ</td><td>Megakaryositler↑</td><td>Blast infiltrasyon &gt;%25</td></tr>
</tbody>
</table></div>
<div class="pearl">İTP'de PY'da bir şey göremezsiniz — Gökçe Pınar bu cümleyi bekliyor!</div>
<p><strong>Tedavi:</strong></p>
<ul>
<li>Plt&gt;30.000 + kanama YOK → <strong>GÖZLEM!</strong> %70-80 spontan düzelir</li>
<li>Plt&lt;20.000 VEYA aktif mukoza kanaması → IVIG 0.8-1 g/kg ×1-2 gün + Prednizolon 1-2 mg/kg</li>
<li>Ateş varsa: Önce IVIG ver (steroid enfeksiyonu maskeler → lösemi kaçırılır)</li>
<li><strong>Steroid ÖNCE: Kİ biyopsisi yap!</strong> (steroid blast hücrelerini baskılar)</li>
<li>Kronik İTP (&gt;12 ay): Splenektomi, Rituksimab, TPO agonistleri (Eltrombopag)</li>
</ul>
<p><strong>Steroid Yan Etkileri (Gökçe Pınar!):</strong> Cushing, hiperglisemi, osteoporoz, büyüme geriliği, immünsüpresyon, peptik ülser, miyopati, katarakt, psikiyatrik, HT</p>
`},{id:14,cat:'kardiyoloji',priority:4,title:'Kalp Yetmezliği — Klinik + Tedavi',tags:'KKY,kalp,taşikardi,hepatomegali,pulsus,digoksin,furosemid,inotrop',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Yaş</th><th>En Sık Neden</th></tr></thead>
<tbody>
<tr><td>Fetal</td><td>Ağır anemi, SVT, AV blok, hidrops fetalis</td></tr>
<tr><td>YD (ilk hf)</td><td>Hipoplastik sol kalp, aort stenozu/koarktasyon, TGA (duktal bağımlı!)</td></tr>
<tr><td>Süt çocuğu (1-6 ay)</td><td>Geniş VSD (<strong>EN SIK!</strong>), AVSD, büyük PDA</td></tr>
<tr><td>Büyük çocuk</td><td>Romatizmal kapak (ARA sekeli!), miyokardit, dilate KMP</td></tr>
</tbody>
</table></div>
<p><strong>Klinik Bulgular Sistematik:</strong></p>
<ul>
<li><strong>TAŞİKARDİ (EN ERKEN BULGU!).</strong> Emme sırasında terleme (karakteristik!)</li>
<li>Takipne, dispne, krepitan raller, wheezing (kardiyak astım)</li>
<li><strong>HEPATOMEGALİ (en önemli!)</strong>, JVD, periferik ödem</li>
<li>Kilo alamama (failure to thrive), emme süresi uzamış</li>
<li><strong>PULSUS ALTERNANS</strong> (kuvvetli-zayıf nabız = ciddi LV disfonksiyonu — Erol soruyor!)</li>
<li>Gallop (S3). KTO &gt;%55</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>İlaç</th><th>Doz</th><th>Etki/Dikkat</th></tr></thead>
<tbody>
<tr><td>Furosemid</td><td>1-2 mg/kg/doz, 2-3×/gün</td><td>Preload↓. <em>Hipokalemi → digoksin toks. riski!</em></td></tr>
<tr><td>Kaptopril/Enalapril</td><td>ACE inhibitörü</td><td>Afterload↓. Öksürük, hiperkalemi</td></tr>
<tr><td>Digoksin</td><td>(Ayrı bölüm)</td><td>(+)İnotrop, (-)Kronotrop</td></tr>
<tr><td>Karvedilol</td><td>β-blokör</td><td>YAVAŞ titre et! Akut dekompansasyonda BAŞLAMA!</td></tr>
<tr><td>Spironolakton</td><td>1-3 mg/kg/gün</td><td>Hafif diüretik. ACEi ile hiperkalemi!</td></tr>
<tr><td>Milrinon</td><td>0.25-0.75 μg/kg/dk IV</td><td>PDE-3 inhib. = inodilatatör (YBÜ)</td></tr>
<tr><td>Dobutamin</td><td>5-20 μg/kg/dk IV</td><td>β1 agonist (YBÜ)</td></tr>
</tbody>
</table></div>
<h4 class="h-section">💊 Digoksin — Mekanizma + Dozlama + Toksisite</h4>
<p><strong>Etki Mekanizması:</strong> Na/K ATPaz inhibe → Na⁺↑ intrasell. → Na/Ca değiştirici↓ → Ca²⁺↑ → kontraktilite↑ (+İnotrop). Vagal tonus↑ → AV ileti↓ (-Kronotrop, -Dromotrop)</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Yaş</th><th>Dijitalizasyon IV</th><th>Oral</th></tr></thead>
<tbody>
<tr><td>Prematüre</td><td>15-25 μg/kg</td><td>20-30 μg/kg</td></tr>
<tr><td>Term YD (0-1 ay)</td><td>20-30 μg/kg</td><td>25-35 μg/kg</td></tr>
<tr><td>Süt çocuğu (1ay-2y)</td><td>30-50 μg/kg</td><td>35-60 μg/kg</td></tr>
<tr><td>&gt;2 yaş</td><td>20-40 μg/kg</td><td>25-50 μg/kg</td></tr>
</tbody>
</table></div>
<p><strong>Dozlama şeması:</strong> TDD'nin ½ hemen → 8 sa ¼ → 8 sa ¼. Her dozdan ÖNCE KH kontrol! (Süt çocuğu &lt;100/dk, büyük çocuk &lt;80/dk → doz ATLA). İdame: TDD ¼-⅓, 2×/gün. Terapötik: <strong>0.8–2.0 ng/mL</strong>. Kan örneği son dozdan ≥6-8 saat sonra.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Toksisiteyi Kolaylaştıran</th><th>Mekanizma</th></tr></thead>
<tbody>
<tr><td><strong>HİPOKALEMİ (EN SIK!)</strong></td><td>K⁺ ve digoksin Na/K ATPaz'ı paylaşır</td></tr>
<tr><td>Hiperkalsemi</td><td>Aditif etki → IV Ca + digoksin = KONTRENDİKE!</td></tr>
<tr><td>Böbrek yetmezliği</td><td>Digoksin %60-80 böbrekten atılır → birikim</td></tr>
<tr><td>İlaç etkileşimi</td><td>Amiodaron, verapamil, kinidin → dozu %50 azalt!</td></tr>
</tbody>
</table></div>
<p><strong>Toksisite Bulguları:</strong> GİS (EN ERKEN: iştahsızlık, kusma) → Nörolojik (xantopsia) → KARDİYAK (bigemine VES, bidireksiyonel VT = EN TEHLİKELİ, AV blok)</p>
<p><strong>EKG:</strong> ST çökmesi kaşık/kepçe, QTc kısalması, PR uzaması = terapötik etki (toksisite ≠!)</p>
<p><strong>Tedavi:</strong> İlacı KES • Hipokalemi → K⁺ IV • AV blok → Atropin 0.02 mg/kg • VT → Lidokain/Fenitoin • Hayatı tehdit → <strong>FAB fragmanları (Digibind)</strong></p>
<div class="warn">IV KALSİYUM VERME (stone heart = kardiyak arrest!) • Kinidin/verapamil/amiodaron ile etkileşim!</div>
`},{id:16,cat:'nefro',priority:4,title:'Hematüri / APSGN / Nefritik vs Nefrotik / SLE Nefriti',tags:'hematüri,APSGN,C3,nefritik,nefrotik,proteinüri,kompleman,GAS,SLE,lupus,anti-dsDNA,hidroksiklorokin',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Glomerüler</th><th>Non-glomerüler</th></tr></thead>
<tbody>
<tr><td>İdrar rengi</td><td>Çay/kola rengi</td><td>Açık kırmızı/pembe</td></tr>
<tr><td>Eritrositler</td><td>Dismorfik</td><td>İzomorfik</td></tr>
<tr><td>Silindirler</td><td>Eritrosit silindir VAR</td><td>Yok</td></tr>
</tbody>
</table></div>
<p><strong>APSGN:</strong> GAS (farenjit 1-3 hf, impetigo 3-6 hf) → immün kompleks → glomerüler inflamasyon</p>
<ul>
<li>Triad: ①Hematüri (çay rengi) ②Ödem (periorbital, sabah belirgin) ③Hipertansiyon</li>
<li>Lab: C3↓ (C4 NORMAL! Alternatif yolak!), ASO↑, Eritrosit silindir(+)</li>
<li><strong>C3 VE C4 düşerse → LUPUS düşün!</strong></li>
<li>C3 &gt;8 hf düşük kalırsa → MPGN veya SLE düşün!</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Nefritik</th><th>Nefrotik</th></tr></thead>
<tbody>
<tr><td>Ana bulgu</td><td>Hematüri+HT+ödem</td><td>Masif proteinüri+hipoalbüminemi+ödem+hiperlipidemi</td></tr>
<tr><td>Proteinüri</td><td>Var ama hafif</td><td><strong>MASIF (&gt;40 mg/m²/saat)</strong></td></tr>
<tr><td>Albümin</td><td>Normal/hafif↓</td><td>ÇOK↓ (&lt;2.5 g/dL)</td></tr>
<tr><td>C3</td><td>↓ (APSGN'de)</td><td>Normal (minimal change)</td></tr>
<tr><td>Tedavi</td><td>Destek + antihipertansif</td><td>Prednizolon 2 mg/kg/gün ×4-6 hf</td></tr>
</tbody>
</table></div>
<p><strong>Nefrotik 3 Komplikasyon:</strong></p>
<ul>
<li>①Enfeksiyon (IgG kaybı, <em>TB riski — steroid başlarken dışla!</em>)</li>
<li>②Tromboz (antitrombin III kaybı → DVT/renal ven trombozu)</li>
<li>③Hiperlipidemi</li>
</ul>
<h4 class="h-section">💊 APSGN Tedavisi</h4>
<ul>
<li>Hipertansiyon: Furosemid 1-2 mg/kg/doz IV (max 6 mg/kg/gün). Kalsiyum kanal blokörü (nifedipin) veya ACE inhibitörü</li>
<li>GAS eradikasyonu: Penisilin 10 gün (enfeksiyon hala aktifse)</li>
<li>Ödem: Tuz + sıvı kısıtlaması, diüretik</li>
<li>Hipertansiyon ensefalopatisi: <strong>ACİL!</strong> Nifedipin sublingual 0.25 mg/kg veya IV nitroprusid</li>
</ul>
<div class="info-box">C3 8 haftadan uzun düşük kalırsa → MPGN veya SLE'yi dışla! APSGN'de C3 genellikle 6-8 hf içinde normalleşir</div>
<h4 class="h-section">🦋 SLE / Lupus Nefriti — Tanı + Tedavi (Sıkça Soruluyor!)</h4>
<p><strong>Tanı Kriterleri (SLICC 2012 — 4/11 kriter veya biyopsi konfirmasyonlu nefriti):</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Klinik</th><th>Laboratuvar</th></tr></thead>
<tbody>
<tr><td>Kelebek döküntü (nazolabial bölge KORUNMUŞ!)</td><td>ANA (+) en sık, non-spesifik</td></tr>
<tr><td>Diskoid döküntü</td><td><strong>Anti-dsDNA (+) → hastalık aktivitesi göstergesi</strong></td></tr>
<tr><td>Artrit (2+ eklem)</td><td><strong>Anti-Sm (+) → SLE'ye spesifik!</strong></td></tr>
<tr><td>Oral ülser</td><td>C3 VE C4 ↓ (her ikisi birden → SLE!)</td></tr>
<tr><td>Saçılma alopesi</td><td>Coombs (+) hemolitik anemi</td></tr>
<tr><td>Nörolojik (psikoz, konvülsiyon)</td><td>Lökopeni &lt;4000, Lenfopeni &lt;1000, Trombositopeni</td></tr>
<tr><td>Serozit (plörit, perikardit)</td><td>Antifosfolipid antikoru (tromboz riski!)</td></tr>
<tr><td>Renal (proteinüri &gt;0.5 g/gün)</td><td>İdrarda eritrosit silindir</td></tr>
</tbody>
</table></div>
<h4 class="h-section">💊 Lupus Tedavisi — Tutuluma Göre</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Tutulum</th><th>Tedavi</th></tr></thead>
<tbody>
<tr><td>Tüm hastalara</td><td><strong>Hidroksiklorokin</strong> (anti-malarial, flare önler) + Güneşten korunma (SPF 50+)</td></tr>
<tr><td>Artrit/artralji</td><td>NSAİİ (ibuprofen/naproksen) ± düşük doz steroid</td></tr>
<tr><td><strong>Lupus nefriti (böbrek)</strong></td><td><strong>Yüksek doz steroid</strong> (prednizolon 2 mg/kg/gün) + Mikofenolat mofetil veya Siklofosfamid (şiddetli)</td></tr>
<tr><td>Ödem (nefrotik komponent)</td><td><strong>Furosemid</strong> 1-2 mg/kg/doz + tuz kısıtlaması</td></tr>
<tr><td>Şiddetli/organ tehdit</td><td>IV puls metilprednizolon 30 mg/kg/gün × 3 gün → oral steroid</td></tr>
<tr><td>Steroid direnci</td><td>Belimumab (biyolojik) veya rituksimab (B-hücre depletion)</td></tr>
</tbody>
</table></div>
<div class="danger-box"><strong>⚠️ Lupus Nefriti Takip:</strong> Anti-dsDNA titresi hastalık aktivitesini izler (yükselirse → flare!). Kompleman C3/C4 düşüklüğü aktif hastalık göstergesi. Her 3 ayda idrar proteinüri/kreatinin oranı</div>
<div class="info-box"><strong>APSGN vs SLE Nefriti:</strong> APSGN → C3↓, C4 NORMAL (alternatif yol). SLE → C3 VE C4 birlikte↓ (klasik yol aktive). C3 &gt;8 hf düşük → MPGN veya SLE!</div>
<h4 class="h-section">🔎 Kalıtımsal Nefritler</h4>
<ul>
<li><strong>Alport Sendromu:</strong> COL4A5 mutasyonu (X-linked, erkek ağır). Hematüri + sağırlık (sensörinöral) + göz (lentikonus). Böbrek biyopsi: basket-weave görünüm. ESRD → nakil</li>
<li><strong>İnce Bazal Membran Nefropatisi (Ailevi Hematüri):</strong> İzole mikroskopik hematüri, iyi huylu, aile öyküsü. Normal işitme, biyopsi ayırt eder</li>
<li><strong>IgA Nefropatisi:</strong> Makroskopik hematüri + ÜSYE eş zamanlı (APSGN'de 1-3 hf gecikmeli). Sık tekrarlayan. Tan: renal biyopsi</li>
</ul>
<h4 class="h-section">⚕️ Nefrotik Sendrom — Yaklaşım</h4>
<ul>
<li>Tanı: Proteinüri &gt;40 mg/m²/saat + hipoalbüminemi + ödem</li>
<li>Minimal Change (EN SIK çocukta, %80): Steroid yanıtlı (%90)</li>
<li>Steroid başlamadan önce: TÜBERKÜLİN TESTİ YAP! (immünosüpresyon → TB aktivasyonu)</li>
<li>Prednizolon: <strong>2 mg/kg/gün</strong> (max 60 mg/gün) × 4-6 hafta → sonra aralıklı</li>
<li>Steroid dirençli → Focal segmental glomerüloskleroz (FSGS) → nefroloji sevk</li>
</ul>
`},{id:17,cat:'noro',priority:2,title:'GBS vs Transvers Miyelit',tags:'GBS,transvers,miyelit,BOS,albümin,IVIG,paralizi,albüminosistolojik',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>GBS</th><th>Transvers Miyelit</th></tr></thead>
<tbody>
<tr><td>Patoloji</td><td>PERİFERİK sinir demiyelinizasyonu</td><td>OMURİLİK inflamasyonu</td></tr>
<tr><td>Paralizi</td><td>ASSENDAN (ayaklardan başlar)</td><td>Belirli seviyenin ALTINDA</td></tr>
<tr><td><strong>Duyu (EN ÖNEMLİ)</strong></td><td>Eldiven-çorap parestezi, NET SEVİYE YOK</td><td><strong>SEVİYE VEREN DUYU KAYBI!</strong> (Sevim eksi verir!)</td></tr>
<tr><td>DTR</td><td>AREFLEKSİ (refleks arkı bozuk)</td><td>Başta arefleksi → sonra HİPERREFLEKSİ</td></tr>
<tr><td>Otonom</td><td>Taşikardi/aritmi/TA dalgalanması</td><td>MESANE/BARSAK disfonksiyonu</td></tr>
<tr><td><strong>BOS</strong></td><td><strong>ALBÜMİNOSİTOLOJİK DİSSOSİASYON</strong> (protein↑, hücre NORMAL) — patognomik!</td><td>Pleositoz (lenfosit↑) + protein↑</td></tr>
<tr><td>MR</td><td>Sinir köklerinde kontrast tutulum</td><td>T2 hiperintens, ≥2 vertebra</td></tr>
<tr><td>Tedavi</td><td>IVIG 0.4 g/kg/gün ×5 gün VEYA plazmaferez</td><td>IV Metilprednizolon 20-30 mg/kg ×3-5 gün</td></tr>
<tr><td>Solunum</td><td>DİAFRAGMA TUTULUMU RİSKİ! → YBÜ</td><td>Üst servikal değilse korunur</td></tr>
</tbody>
</table></div>
<div class="pearl">GBS'de BOS'ta albüminosistolojik dissosiasyon patognomiktir. TM'de seviye veren duyu kaybı ve mesane disfonksiyonu vardır.</div>
`},{id:18,cat:'nefro',priority:2,title:'İYE + Antibiyotik Profilaksisi + VUR',tags:'İYE,VUR,VCUG,DMSA,profilaksi,posterior üretral valv,idrar analizi',content:`
<p><strong>Akut Tedavi:</strong> Gram(-) basil → Ağır İYE: 3. kuşak sefalosporin IV. Hafif: oral sefdinir/sefpodoksim. Süre: 7-14 gün.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Tetkik</th><th>Ne Zaman</th><th>Ne Gösterir</th></tr></thead>
<tbody>
<tr><td>Renal USG</td><td>İlk İYE'de herkese (tedavi sırasında)</td><td>Hidronefröz, böbrek boyutu</td></tr>
<tr><td>VCUG</td><td>&lt;2 yaş, erkek, tekrarlayan, hidronefröz — enfeksiyon bittikten 4-6 HF SONRA</td><td>VUR grade 1-5</td></tr>
<tr><td>DMSA sintigrafi</td><td>VUR saptanmış, tekrarlayan İYE — akut fazdan 4-6 AY SONRA</td><td>Renal skar</td></tr>
</tbody>
</table></div>
<p><strong>Antibiyotik profilaksi:</strong> 1. kuşak sefalosporin (sefaleksin) veya trimetoprim. TEDAVİ DOZUNUN 1/3-1/4'ü, <strong>GECE YATMADAN ÖNCE TEK DOZ</strong>.</p>
<p><strong>VUR:</strong> Grade 1-3: %80 spontan düzelir → profilaksi. Grade 4-5 → CERRAHİ.</p>
<div class="pearl">Posterior Üretral Valv (Elif Bahat!): Erkek süt çocuğu, "kesik kesik idrar", bilateral hidronefröz. VCUG: posterior üretra dilatasyonu. ACİL endoskopik ablasyon.</div>
<p><strong>İdrar Analizi:</strong></p>
<ul>
<li>Nitrit(+) → Gram(-) bakteri</li>
<li>Lökosit esteraz(+) → İYE işareti</li>
<li>Anlamlı üreme: Suprapubik→herhangi üreme; Kateter→&gt;10⁴; Orta akım→Gram(-) &gt;10⁵, <strong>Gram(+) &gt;2×10⁴</strong></li>
<div class="warn">Fevziye hoca: "Gram negatif sondayla alınanda, suprapubik alınanda, gram pozitif orta akımda eşik değerleri nedir?" diye sormuş. Gram(+) için <strong>2×10⁴</strong> eşiği bilinmiyordu → puan gitti!</div>
</ul>
`},{id:19,cat:'nefro',priority:1,title:'Oligüri + ABY — Prerenal/Renal/Postrenal',tags:'oligüri,ABY,ATN,FENa,prerenal,renal,postrenal,hiperpotasemi',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Parametre</th><th>Prerenal</th><th>Renal (ATN)</th><th>Postrenal</th></tr></thead>
<tbody>
<tr><td>BUN/Cr</td><td>&gt;20</td><td>&lt;20</td><td>Değişken</td></tr>
<tr><td>FENa</td><td>&lt;%1 (tübül sağlam)</td><td>&gt;%2 (tübül hasarlı)</td><td>Değişken</td></tr>
<tr><td><strong>İdrar dansitesi</strong></td><td>&gt;1.020 (konsantre)</td><td>~1.010 (izostenüri)</td><td>Değişken</td></tr>
<tr><td>İdrar Na</td><td>&lt;20 mEq/L</td><td>&gt;40 mEq/L</td><td>Değişken</td></tr>
<tr><td>Sediment</td><td>Normal/hyalin silindir</td><td>Muddy brown granüler silindir</td><td>Normal</td></tr>
<tr><td>USG</td><td>Normal</td><td>Normal/büyük böbrek</td><td>BİLATERAL HİDRONEFROZ</td></tr>
</tbody>
</table></div>
<div class="pearl">Prerenal'de böbrek sağlam → idrarı konsantre eder (&gt;1.020). Renal hasarda tübüller çalışmaz → seyreltik (~1.010)</div>
<p><strong>Hiperpotasemi Tedavi Sırası (Embiya mekanizma soruyor!):</strong></p>
<ol class="content" style="padding-left:18px">
<li><strong>Ca Glukonat 0.5-1 mL/kg IV YAVAŞ</strong> → K⁺ DÜŞÜRMEZ, kalp zarını stabilize eder → KARDİYOPROTEKTİF (EN HIZLI!)</li>
<li>İnsülin 0.1 Ü/kg + %10 Dex 5 mL/kg → Na-K ATPaz aktive → K⁺ HÜCRE İÇİNE</li>
<li>Salbutamol 0.15 mg/kg nebül → β2 → Na-K ATPaz → K⁺ HÜCRE İÇİNE (insülinle sinerjik!)</li>
<li>NaHCO₃ 1-2 mEq/kg → asidoz düzelir → K⁺ HÜCRE İÇİNE</li>
<li>Kayexalate 1 g/kg → GİS'ten K⁺ bağlar → VÜCUTTAN UZAKLAŞTIRIR</li>
</ol>
<p><strong>EKG İlerlemesi:</strong> Sivri T → PR uzama → P kaybolur → QRS genişler → sinüzoidal dalga → VF/asistoli</p>
`},{id:20,cat:'nefro',priority:1,title:'HÜS + Bartter/Gitelman + Enürezis',tags:'HÜS,Bartter,Gitelman,enürezis,alarm,desmopressin,imipramin,E.coli',content:`
<p><strong>HÜS Triadı:</strong> ①Mikroanjiopatik hemolitik anemi ②Trombositopeni ③Akut böbrek hasarı</p>
<p>En sık neden: E.coli O157:H7 Shiga toksin. Kanlı ishalden 5-10 gün sonra.</p>
<div class="warn">Antibiyotik VERMEYİN! (toksin salınımı↑). Trombosit transfüzyonu KONTRENDİKE!</div>
<h4 class="h-section">🔎 HÜS Klinik + Lab</h4>
<ul>
<li>Kanlı ishal → 5-10 gün sonra triad başlar</li>
<li>Pletore (hemoliz), oligüri, peteşi</li>
<li>Lab: Hb↓ + fragmantositler/sferositler + Plt↓ + Kreatinin↑ + LDH↑ + Direkt Coombs NEGATİF</li>
<li>Direkt Coombs NEGATİF → non-immün hemoliz (AIHA'dan farkı!)</li>
</ul>
<h4 class="h-section">💊 HÜS Tedavisi</h4>
<ul>
<li>Destek: Sıvı dengesi, antihipertansif (ACE inhibitörü KONTRENDİKE — renin bağımlı HT!), transfüzyon (Hb&lt;7 veya semptomatik)</li>
<li>Diyaliz: Oligüri/anüri + hiperkalemi/asidoz → %50 hastada gerekli</li>
<li>Trombosit transfüzyonu: <strong>KONTRENDİKE</strong> (mikrovasküler tromboz artarır!)</li>
<li>Antibiyotik: <strong>KONTRENDİKE</strong> (Stx salınımı artar → hasarı kötüleştirir)</li>
</ul>
<div class="info-box"><strong>TTP vs HÜS:</strong> TTP erişkinde, ateş + nörolojik semptom + ADAMTS13 eksikliği. Çocukta HÜS daha sık, renal baskın</div>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Bartter</th><th>Gitelman</th></tr></thead>
<tbody>
<tr><td>Tübül defekti</td><td>Henle kulpu</td><td>Distal tübül</td></tr>
<tr><td>Benzetme</td><td>Furosemid benzeri</td><td>Tiazid benzeri</td></tr>
<tr><td>Kalsiyum</td><td>HİPERKALSİÜRİ + nefrokalsinoz</td><td>HİPOKALSİÜRİ + hipomagnezemi</td></tr>
<tr><td>Ortak</td><td colspan="2">Hipokalemi + metabolik alkaloz + hipokloremi + TA NORMAL</td></tr>
</tbody>
</table></div>
<p><strong>Enürezis:</strong> ≥5 yaş, ayda ≥2 kez. Primer (hiç kuru kalmamış) vs Sekonder (6 ay kuru→tekrar)</p>
<p><em>Önce organik dışla:</em> İYE, DM, Dİ, spinal anomali, konstipasyon!</p>
<p><strong>Tedavi:</strong></p>
<ul>
<li>Davranışsal: Akşam sıvı kısıtla, uyumadan iştirt, motivasyonel takvim</li>
<li><strong>Alarm tedavisi (1. TERCİH!):</strong> Nem sensörü. 2-3 ay. %65-75 başarı, en etkili uzun vadeli</li>
<li>Desmopressin: 0.2-0.4 mg oral gece. <em>Hızlı etki ama kesilince RELAPS %60-70! SU KISITLAMASI ŞART!</em></li>
<li>İmipramin: Kardiyotoksik! Doz aşımında LETAL. EKG takibi gerekli</li>
</ul>
`},{id:21,cat:'yd',priority:3,title:'YD Sarılığı — Rh/ABO + Kernikterus + Uzamış',tags:'sarılık,Rh,ABO,kernikterus,fototerapi,exchange,bilirubin,bilyer atrezi',content:`
<p><strong>Patolojik Sarılık Kriterleri:</strong></p>
<ul>
<li>İlk 24 saatte başlama</li><li>TB &gt;12 (term) / 10 (prematüre)</li>
<li>Günlük artış &gt;5 mg/dL</li><li>Direkt bilirubin &gt;2 mg/dL veya total &gt;%20</li><li>2 haftadan uzun süre</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Rh Uyuşmazlığı</th><th>ABO Uyuşmazlığı</th></tr></thead>
<tbody>
<tr><td>Şiddet</td><td>AĞIR (hydrops fetalis)</td><td>Genelde hafif-orta</td></tr>
<tr><td>Coombs</td><td>Kuvvetli pozitif</td><td>Zayıf pozitif veya negatif</td></tr>
<tr><td>İlk gebelik</td><td>Genelde etkilenmez (sensitizasyon lazım)</td><td>İLK gebelikte olabilir!</td></tr>
</tbody>
</table></div>
<p><strong>Kernikterus Kronik:</strong> ①Atetoid (diskinetik) serebral palsi ②Sensorinöral işitme kaybı ③Yukarı bakış paralizisi ④Diş mine displazisi</p>
<p><strong>Tedavi:</strong></p>
<ul>
<li>Fototerapi: Mavi ışık (420-490 nm) → lumirubin → böbrek+safra. Gözler korunmalı, 30-50 cm mesafe</li>
<li>Exchange: Fototerapi aşıldı, hızla yükseliyor → 2 kat kan volümü (170 mL/kg)</li>
<li>IVIG: İmmün hemolitik sarılıkta 0.5-1 g/kg IV</li>
</ul>
<p><strong>Uzamış Sarılık (&gt;2 hf):</strong></p>
<ul>
<li>İNDİREKT yüksek: Anne sütü sarılığı (EN SIK, 3. ayda düzelir), konjenital hipotiroidi, Gilbert</li>
<li><strong>DİREKT yüksek: BİLİYER ATREZİ (EN TEHLİKELİ!)</strong> — Akolik gaita + koyu idrar. Kasai &lt;60 günde!</li>
</ul>
`},{id:22,cat:'yd',priority:3,title:'YD Baş Travmaları',tags:'kaput,sefal,subgaleal,sütür,kanama,periost',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Kaput</th><th>Sefalhematom</th><th>Subgaleal</th></tr></thead>
<tbody>
<tr><td>Tabaka</td><td>Deri altı</td><td>Periost altı</td><td>Galea altı</td></tr>
<tr><td><strong>Sütürler</strong></td><td><strong>GEÇER</strong></td><td><strong>SÜTÜRLERDE DURUR!</strong></td><td>Geçer</td></tr>
<tr><td>Görünüm</td><td>Yaygın/hamursu/pitting</td><td>Sert/sınırlı/flüktüan</td><td>Dalgalı/geniş/<strong>PROGRESİF!</strong></td></tr>
<tr><td>Hemogram</td><td>Minimal</td><td>Hafif sarılık</td><td><strong>MASİF ANEMİ + HİPOVOLEMİK ŞOK!</strong></td></tr>
<tr><td>Tedavi</td><td>Günlerde geçer</td><td>Haftalarda, kalsifikasyon olabilir</td><td><strong>ACİL! (kan transfüzyonu)</strong></td></tr>
</tbody>
</table></div>
<div class="pearl">Subgaleal neden tehlikeli? Galea altı boşluk çok geniş → 260 mL'ye kadar kan → 3 kg bebeğin total kan volümü ~240 mL → masif kanama → şok!</div>
<p><strong>Ezber:</strong> Kaput=geniş/sütür GEÇER/zararsız | Sefal=sınırlı/<strong>SÜTÜRDE DURUR</strong>/sert | Subgaleal=geniş/HAYATI TEHDİT</p>
`},{id:23,cat:'yd',priority:2,title:'YD Taramaları',tags:'topuk,tarama,FKÜ,hipotiroidi,KAH,biyotinidaz,GKD,ROP,işitme,SMA',content:`
<p><strong>Topuk Kanı 6 Hastalık:</strong></p>
<ol class="content" style="padding-left:18px">
<li>Fenilketonüri (FKÜ): Fenilalanin düzeyi → düşük fenilalanin diyeti</li>
<li>Konjenital Hipotiroidi: <strong>TSH bakılır!</strong> (santral hipotiroidi TSH ile KAÇIRILIR → sT4 de bak)</li>
<li>Biyotinidaz eksikliği → biyotin tedavisi</li>
<li>Kistik Fibrozis: IRT → yüksekse ter testi ile doğrula</li>
<li>KAH: 17-OHP. <em>Prematürede yalancı pozitiflik sık!</em></li>
<li>Hemoglobinopatiler: Hb elektroforezi</li>
</ol>
<p><strong>Zamanlama:</strong> 48-72 saat sonra (beslenme başlamış olmalı). Prematürede 7. günde tekrar. SMA için ilk 48 saatte ayrı örnek!</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Tarama</th><th>Zamanlama</th><th>Yöntem / Risk Faktörleri</th></tr></thead>
<tbody>
<tr><td>İşitme</td><td>İlk 1 ayda</td><td>OAE → risk varsa ABR. Risk (10): prematürite, hiperbilirübinemi, menenjit, ototoksik ilaç, aile öyküsü, kraniofasiyal anomali, &lt;1500g, mekanik ventilasyon &gt;5 gün, TORCH, asfiksi</td></tr>
<tr><td>Görme</td><td>İlk 1 ayda</td><td>Kırmızı refle → katarakt, retinoblastom, glokom</td></tr>
<tr><td>ROP</td><td>Postnatal 4-6. hf</td><td>≤32 hf VEYA ≤1500 g</td></tr>
<tr><td>GKD</td><td>USG: 4-6. hf</td><td>Risk: kız, makat, aile öyküsü, oligohidramnios. Barlow+Ortolani+Galeazzi</td></tr>
<tr><td>Konjenital KH</td><td>İlk gün</td><td>Pulse oksimetri → postduktal &lt;%95 veya pre-post fark &gt;%3 → EKO!</td></tr>
</tbody>
</table></div>
<h4 class="h-section">👂 İşitme Taraması — 10 Risk Faktörü (Embiya 10 tane istiyor!)</h4>
<ol class="content" style="padding-left:18px">
<li>Prematürite (&lt;32 hafta)</li>
<li>Hiperbilirübinemi (exchange transfüzyon gerektiren düzey)</li>
<li>Menenjit / ensefalit öyküsü</li>
<li>Ototoksik ilaç maruziyeti (gentamisin, furosemid)</li>
<li>Ailede konjenital işitme kaybı öyküsü</li>
<li>Kraniofasiyal anomali (kulak-yüz anomalisi)</li>
<li>Düşük doğum ağırlığı (&lt;1500 g)</li>
<li>Mekanik ventilasyon &gt;5 gün</li>
<li>TORCH enfeksiyonu (CMV, rubella, sifilis)</li>
<li>Perinatal asfiksi (HIE)</li>
</ol>
<div class="info-box">İlk tarama: <strong>OAE (Otoacoustic Emissions)</strong> — hızlı, kolay, tüm YD'a. Risk grubu veya OAE geçemeyenler → <strong>ABR (Auditory Brainstem Response)</strong>. İlk 1 ayda yapılmalı.</div>

<h4 class="h-section">🦴 GKD Taraması — Risk Faktörleri + Muayene</h4>
<p><strong>Risk Faktörleri (6):</strong></p>
<ul>
<li>GKD'li birinci derece akraba (kardeş/ebeveyn)</li>
<li>İlk kız çocuk (ligamentöz laksitiye yatkın)</li>
<li>Makat prezentasyon</li>
<li>Oligohidramnios</li>
<li>Makrozomi</li>
<li>Ayak deformitesi (pes ekinovarus)</li>
</ul>
<p><strong>Muayene:</strong></p>
<ul>
<li><strong>Barlow testi:</strong> Kalça fleksiyonda, addüksiyonda baskı → kalça yerinden çıkıyor mu? (kışkırtma testi)</li>
<li><strong>Ortolani testi:</strong> Abdüksiyon sırasında "klik" sesi → yerinden çıkmış kalçayı yerine getirme</li>
<li><strong>Galeazzi testi:</strong> Supin, kalça+diz 90° → diz yükseklikleri farklıysa asimetri = patolojik</li>
<li>Pili asimetrisi (uyluk pilileri eşit değilse)</li>
</ul>
<div class="info-box">Tarama zamanı: <strong>4-6. haftada USG</strong> (kemikleşme tamamlanmamış, USG üstün). Beklenirse: Grafi (4-6 aydan sonra kemikleşince).</div>

<h4 class="h-section">❤️ Konjenital Kalp Hastalığı Taraması</h4>
<ul>
<li>Yöntem: <strong>Pulse oksimetre</strong> (postduktal = sağ el + ayak)</li>
<li>Zamanlama: Doğumdan 24-48 saat sonra (duktal kapanma sonrası)</li>
<li><strong>Pozitif kriter:</strong> Postduktal SpO₂ &lt;%95 VEYA Pre-postduktal fark &gt;%3 → EKO!</li>
</ul>

<h4 class="h-section">🩸 Topuk Kanı — Eşik Değerler</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Hastalık</th><th>Ne Ölçülür</th><th>Eşik/Pozitif</th></tr></thead>
<tbody>
<tr><td>Konjenital Hipotiroidi</td><td>TSH</td><td>&gt;10 mIU/L → ileri merkeze. &gt;40 → tedavi başla</td></tr>
<tr><td>FKÜ</td><td>Fenilalanin</td><td>&gt;120 μmol/L</td></tr>
<tr><td>KAH</td><td>17-OHP</td><td>Gestasyon yaşına göre; prematürede yalancı pozitif sık!</td></tr>
<tr><td>Biyotinidaz</td><td>Biyotinidaz aktivitesi</td><td>&lt;%30 aktivite</td></tr>
<tr><td>Kistik Fibrozis</td><td>IRT (immünoreaktif tripsinojen)</td><td>Yüksek → ter testi doğrulama</td></tr>
<tr><td>SMA</td><td>SMN1 geni (MLPA)</td><td>Delesyon var → teyit testi</td></tr>
</tbody>
</table></div>
<div class="info-box"><strong>Konjenital hipotiroidi tarama algoritması (Filiz hoca soruyor!):</strong><br>
Topuk kanı TSH → Ara değer (4-10 mIU/L): 2-4 hf içinde tekrar çağır → &gt;10: ileri merkeze gönder → İleri merkezde: <strong>Serum TSH + sT4 ölçülür</strong> (santral hipotiroidi TSH normal/düşük olabilir, sT4 de bakılmalı!)</div>
<div class="warn">SMA taraması: İlk <strong>48 saatte</strong> ayrı örnek! Pudralı eldiven kullanma (DNA bozar) → pudrasız veya iki kat poşet eldiven. Örnekleri üst üste koyma, kilitli poşette sakla.</div>
`},{id:24,cat:'yd',priority:2,title:'Pleksus Brakialis — Erb/Klumpke',tags:'pleksus,Erb,Klumpke,Horner,doğum,paralizi,frenik',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Tip</th><th>Kök</th><th>Pozisyon</th><th>Kayıp Refleks</th><th>Korunan</th></tr></thead>
<tbody>
<tr><td><strong>Erb-Duchenne (%90)</strong></td><td>C5-C6</td><td>"Bahşiş pozisyonu": Omuz addüksiyon+iç rotasyon, dirsek ekstansiyon, ön kol pronasyon</td><td>Moro(-), biseps(-), radyal(-)</td><td>Bilek fleksiyonu+yakalama</td></tr>
<tr><td><strong>Klumpke (nadir)</strong></td><td>C8-T1</td><td>"Pençe el": Bilek düşüklüğü, parmak fleksörleri zayıf</td><td>Yakalama(-)</td><td>Omuz+dirsek</td></tr>
<tr><td>Total</td><td>C5-T1</td><td>Tüm kol felci, flask paralizi</td><td>Hepsi(-)</td><td>—</td></tr>
</tbody>
</table></div>
<div class="pearl">Klumpke + HORNER (MUTLAKA SÖYLE!): T1 kök hasarı → sempatik zincir → miyozis + pitozis + enoftalmus + anhidroz</div>
<p><strong>Frenik Sinir Felci:</strong> C3-C5 → diyafram paralizisi → solunum sıkıntısı. Paradoks karın hareketi. Grafide diyafram yüksek.</p>
<p><strong>Prognoz:</strong> Erb %90 spontan. Klumpke/total kötü prognoz. Tedavi: 2 hf immobilizasyon → pasif egzersiz → 3-6 ay yoksa cerrahi</p>
<h4 class="h-section">🦾 Tip Detayları — Sınav İçin Kritik</h4>
<ul>
<li><strong>Erb-Duchenne (C5-C6):</strong> Kolda adduksiyon+iç rotasyon+pronasyon = <em>"garson bahşiş"</em> pozisyonu
  <ul>
    <li>Kayıp refleksler: Biseps ↓, Moro asimetrik/yok!</li>
    <li><strong>PARMAKLAR: Korunmuş</strong> (kavrama normal)</li>
    <li>En sık (%90)!</li>
  </ul>
</li>
<li><strong>Klumpke (C8-T1):</strong> El parmakları tutulur → kavrama yok
  <ul>
    <li><strong>Horner sendromu görülebilir!</strong> (T1 → ptosis, miyozis, anhidroz)</li>
    <li>Nadir (%1)</li>
  </ul>
</li>
<li><strong>Mix Tip (C5-T1):</strong> Tam paralizi</li>
<li><strong>Klavikula kırığı:</strong> Ayırıcı tanıda düşün (krepitasyon, sınırlı hareket, grafi ile tanı)</li>
<li><strong>Tanı:</strong> Klinik. <strong>Tedavi:</strong> Fizyoterapi, 3-6 ayda iyileşme beklenir</li>
</ul>
<div class="info-box"><strong>Ali Cansu + Gül Şalcı:</strong> En sık ERB DUCHENNE. Klumpke'de HORNER SENDROMU söylemeyi unutma!</div>
`},{id:25,cat:'yd',priority:1,title:'Prematüre Sorunları — NEK/ROP/PDA/BPD/İVK',tags:'prematüre,NEK,PDA,BPD,RDS,surfaktan,kafein,pnömatosis,pneumoperitoneum',content:`
<p><strong>PDA:</strong> Bounding pulse (sıçrayıcı nabız), geniş nabız basıncı, SÜREKLİ (machinery) üfürüm.</p>
<p>Tedavi: İbuprofen veya İndometazin (COX inhibitörü). Kontrendike: trombositopeni, kanama, NEK, renal yetmezlik.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>NEK Evresi</th><th>Klinik</th><th>Radyoloji</th><th>Tedavi</th></tr></thead>
<tbody>
<tr><td>Evre 1 (Şüpheli)</td><td>Beslenme intoleransı, distansiyon</td><td>Normal</td><td>Oral kes, IV sıvı, AB, NG dekompresyon</td></tr>
<tr><td>Evre 2 (Kesin)</td><td>Kanlı gaita</td><td><strong>PNÖMATOSİS İNTESTİNALİS!</strong></td><td>Aynı + izlem</td></tr>
<tr><td>Evre 3 (İleri)</td><td>Şok, peritonit</td><td><strong>PNÖMOPERİTONEUM → ACİL CERRAHİ!</strong></td><td>ACİL cerrahi</td></tr>
</tbody>
</table></div>
<ul>
<li><strong>AB:</strong> Ampisilin + Gentamisin + Metronidazol</li>
<li><strong>Koruma:</strong> Anne sütü (en önemli!), probiyotikler</li>
<li><strong>RDS:</strong> Buzlu cam + hava bronkogramı → Surfaktan intratrakeal, CPAP. Antenatal steroid: 24-34 hf → betametazon</li>
<li><strong>BPD:</strong> &gt;28 gün O₂ ihtiyacı. Risk: prematürite + mekanik ventilasyon</li>
<li><strong>Prematüre Apnesi:</strong> ≥20 sn → KAFEİN SİTRAT yükleme 20 mg/kg → idame 5 mg/kg/gün</li>
<li><strong>İVK:</strong> &lt;32 hf, germinal matriks kanaması. Grade 3-4 → hidrosefali riski</li>
</ul>
<h4 class="h-section">📋 Ballard Skorlaması — Gestasyonel Yaş Tayini</h4>
<ul>
<li><strong>Amaç:</strong> Prematürenin gestasyonel yaşını klinik olarak belirlemek</li>
<li><strong>Nöromüsküler kriterler (6):</strong> Postür, bilek fleksiyon açısı, kol geri çekme, popliteal açı, eşarp belirtisi, topuk-kulak</li>
<li><strong>Fiziksel kriterler (6):</strong> Deri, lanugo, planta yüzeyi, meme, göz/kulak, genital</li>
<li>Toplam puan → gestasyonel hafta tahmin edilir</li>
<li><strong>Yeni Ballard:</strong> Erken prematüreye (24-26 hf) daha uygun; daha geniş aralıkta geçerli</li>
</ul>
`},{id:26,cat:'yd',priority:1,title:'SGA Bebek ve Polisitemi',tags:'SGA,polisitemi,Hct,exchange,TORCH,plasental',content:`
<p><strong>SGA:</strong> Doğum ağırlığı &lt;10. persentil.</p>
<ul>
<li>Simetrik (erken → TORCH, tüm boyutlar küçük) vs Asimetrik (geç → plasental yetmezlik, baş korunmuş)</li>
<li>Komplikasyonlar: <strong>HİPOGLİSEMİ(!), hipotermi, polisitemi, hipokalsemi</strong></li>
</ul>
<p><strong>SGA Komplikasyonları (Detay):</strong></p>
<ul>
<li><strong>Hipoglisemi:</strong> 0-6 saatte topuktan KŞ bakılmalı! Hedef KŞ &gt;45 mg/dL</li>
<li><strong>Polisitemi:</strong> Venöz Hct &gt;%65. Belirtiler: Pletore, uyuşukluk, nöbet, taşikardi
  <ul>
    <li>Asemptomatik + Hct %65-70 → İzlem</li>
    <li>Semptomatik VEYA Hct &gt;%70 → Parsiyel exchange (SF ile, hedef Hct %50-55)</li>
  </ul>
</li>
</ul>
<p><strong>TORCH Enfeksiyonlar (Simetrik SGA nedeni):</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Etken</th><th>Spesifik Bulgu</th></tr></thead>
<tbody>
<tr><td><strong>Toksoplazmoz</strong></td><td>İntrakranial kalsifikasyon (bazal ganglion), korioretinit</td></tr>
<tr><td><strong>Rubella</strong></td><td>Katarakt, KKH (PDA), sağırlık</td></tr>
<tr><td><strong>CMV</strong> (en sık konjenital!)</td><td>Periventriküler kalsifikasyon, mikrosefali, sağırlık</td></tr>
<tr><td><strong>HSV</strong></td><td>Hepatit, DIC, ensefalit</td></tr>
<tr><td><strong>Sifilis</strong></td><td>"Kemik ağrısı", burun akıntısı (snuffles)</td></tr>
</tbody>
</table></div>
<div class="pearl">SGA vs Premature Ayrımı: Gestasyon yaşına bak! SGA term olabilir.</div>
`},{id:27,cat:'yd',priority:3,title:'YD Sepsisi — Erken/Geç + Tedavi',tags:'sepsis,ampisilin,gentamisin,IT oranı,CRP,Listeria,GBS,E.coli',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Erken (&lt;72 sa)</th><th>Geç (&gt;72 sa)</th></tr></thead>
<tbody>
<tr><td>Bulaş</td><td>Vertikal (doğum kanalı)</td><td>Horizontal (çevre)</td></tr>
<tr><td>Risk</td><td>PPROM&gt;18sa, maternal ateş, GBS(+), koryoamniyonit</td><td>Prematürite, kateter, uzun yatış</td></tr>
<tr><td>Etken</td><td>GBS (en sık!), E.coli, Listeria</td><td>S.aureus, CoNS, Gram(-), Kandida</td></tr>
<tr><td><strong>Tedavi</strong></td><td><strong>AMPİSİLİN + GENTAMİSİN</strong></td><td><strong>AMPİSİLİN + SEFOTAKSİM</strong></td></tr>
</tbody>
</table></div>
<div class="pearl">Ampisilin neden her ikisinde de var? → LİSTERİA MONOSİTOGENES için! Listeria'ya sefotaksim+gentamisin ETKİSİZDİR!</div>
<p><strong>Tetkikler:</strong></p>
<ul>
<li>Kan kültürü: ALTIN STANDART, antibiyotik ÖNCE al</li>
<li>Hemogram+PY: I/T oranı &gt;0.16 (ilk hf) / &gt;0.2 (sonra). Toksik granülasyon, vakuolizasyon</li>
<li>CRP &gt;1 mg/dL, Prokalsitonin &gt;2 ng/mL</li>
<li>LP: Menenjit dışla!</li>
<li>Hiperglisemi de görülebilir (stres yanıtı!)</li>
</ul>
<p><strong>YD sepsis öntanıları:</strong> Sepsis, İYE, Menenjit, Pnömoni, Dehidratasyon, Fazla sarmalama, Metabolik hastalık (galaktozemi, organik asidemi)</p>
`},{id:28,cat:'yd',priority:2,title:'YD Konvülsiyonları',tags:'YD,konvülsiyon,ionize kalsiyum,fenobarbital,subtle,KAH',content:`
<p><strong>Subtle Nöbet Tipleri (5 tip, EZBERLE!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Oral-bukkal-lingual hareketler (çiğneme, yalama, emme)</li>
<li>Göz deviyasyonu veya kırpma (ritmik, amaçsız)</li>
<li>Apne + bradikardi (konvülsif apne)</li>
<li>Pedal çevirme (bisiklet hareketi)</li>
<li>Yüzme hareketi</li>
</ol>
<p><strong>Tedavi:</strong> ABC → damar yolu → <strong>TOPUKTAN KŞ</strong> (YD'da topuktan!) → KŞ&lt;50 → %10 Dex 2 mL/kg IV → 8 mg/kg/dk idame</p>
<div class="warn">Yakup hoca: "Kalsiyum bakılır" DİYEMEZSİN → "İYONİZE KALSIYUM bakılır" de! Düşükse %10 Ca Glukonat 2 mL/kg IV YAVAŞ</div>
<p><strong>Antikonvülsif Endikasyonları (4 MADDE!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>1 saatte 3'ten FAZLA nöbet</li>
<li>1 nöbet 5 dakikadan UZUN</li>
<li>Kardiyorespiratuvar bozulma</li>
<li>Klinik veya EEG ile kanıtlanmış devam eden nöbet</li>
</ol>
<p>İlaç: Fenobarbital 20 mg/kg IV yükleme (max total 40 mg/kg)</p>
<div class="pearl">KRİTİK: Na↓ + K↑ + Hipoglisemi birlikte → KAH (Böbrek Üstü Bezi Yetmezliği) düşün! Aldosteron + kortizol eksikliği</div>
<h4 class="h-section">⚡ BÖBREK ÜSTÜ BEZİ YETMEZLİĞİ (Yakup Hoca BIRAKIRIM diyor!)</h4>
<div class="danger-box"><strong>KRİTİK:</strong> YD'da hem HİPONATREMİ hem HİPERKALEMİ hem de HİPOGLİSEMİ birlikte → KAH (Böbrek Üstü Bezi Yetmezliği)! Bu üç elektrolitin birlikte etkilenmesi = aldosteron + kortizol yetersizliği.<br>
Yakup hoca: "Bunu söylemeyene yardım etmem!" diyor.</div>
<p><strong>YD Konvülziyonu Yaklaşımı (Yakup Hoca Adım Adım İstiyor):</strong></p>
<ol class="content" style="padding-left:18px">
<li>ABC → Damar yolu aç → IV sıvı</li>
<li><strong>TOPUKTAN KŞ ölç</strong> (YD'da topuktan!) → KŞ&lt;40-45 → %10 Dex 2 mL/kg IV bolus</li>
<li>Kan tetkiki: Elektrolitler (Na, K, Ca, Mg, P → hepsini ayrı ayrı say!), KŞ, kan gazı</li>
<li>Hipokalsemi → <strong>Kan gazından İYONİZE Ca bak!</strong> (total Ca sonucu bekleyemeyiz, uzun sürer)</li>
<li>Eğer Hipokalsemi: %10 Ca Glukonat 2 mL/kg IV YAVAŞ</li>
<li>Hem Na↓ hem K↑ hem glukoz↓ → KAH düşün → hidrokortizon!</li>
<li>Ateş/SSS enfeksiyonu şüphesi → kültürler al → AB başla</li>
<li>Antikonvülsif endikasyonu var mı? (4 kriter - aşağıda)</li>
</ol>
<div class="info-box"><strong>Antikonvülsif Başlama Endikasyonu (4 madde — Yakup hoca slayttaki 4 maddeyi bekliyor!):</strong>
<ol style="padding-left:18px;margin:4px 0">
<li>1 saatte 3'ten fazla nöbet</li>
<li>Tek nöbet 5 dakikadan uzun</li>
<li>Kardiyorespiratuvar bozulma eşlik ediyor</li>
<li>Klinik veya EEG ile kanıtlanmış devam eden nöbet</li>
</ol>
İlaç: Fenobarbital 20 mg/kg IV yükleme (max total 40 mg/kg)</div>
`},{id:29,cat:'endokrin',priority:2,title:'KAH — 21-OH vs 11β-OH',tags:'KAH,adrenal,21OH,11OH,17OHP,virilizasyon,kriz,ambigüs',content:`
<p><strong>Genel:</strong> Adrenal kortekste kortizol sentez enzim defekti. OR. En sık (%90-95): 21-hidroksilaz eksikliği.</p>
<p><strong>Patogenez:</strong> Kortizol sentezlenemiyor → negatif feedback yok → ACTH↑ → adrenal korteks hiperplazisi → bloktan önceki ara ürünler ve androjenler aşırı üretilir.</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Enzim</th><th>21-OH</th><th>11β-OH</th></tr></thead>
<tbody>
<tr><td>Kortizol</td><td>↓</td><td>↓</td></tr>
<tr><td>Aldosteron/DOC</td><td>Aldosteron↓</td><td>DOC↑ (mineralokortikoid!)</td></tr>
<tr><td>Androjen</td><td>↑↑</td><td>↑</td></tr>
<tr><td><strong>Tansiyon</strong></td><td>↓/normal</td><td><strong>↑ HİPERTANSİYON!</strong></td></tr>
<tr><td>Lab</td><td>17-OHP↑↑</td><td>DOC↑, 11-deoksikortizol↑</td></tr>
<tr><td>Klinik fark</td><td>Tuz kaybettiren form, virilizasyon</td><td>Virilizasyon + <strong>HİPERTANSİYON</strong></td></tr>
</tbody>
</table></div>
<p><strong>Tuz kaybettiren form (%75, 21-OH):</strong> 1-2. hf → kusma, dehidratasyon, hiponatremi, HİPERKALEMİ, metabolik asidoz → ADRENAL KRİZ!</p>
<p><strong>Tedavi:</strong> Hidrokortizon 10-15 mg/m²/gün (3 doz). Fludrokortizon (tuz kaybettirende). Kriz: IV SF bolus + IV hidrokortizon stres dozu (50-100 mg/m²) + hipoglisemi düzelt.</p>
`},{id:30,cat:'endokrin',priority:2,title:'DKA — Tedavi + Beyin Ödemi',tags:'DKA,insülin,beyin ödemi,K+,KŞ,asidoz,ketonüri',content:`
<p><strong>Tanı:</strong> KŞ&gt;200 + pH&lt;7.3 veya HCO₃&lt;15 + ketonüri/ketonemi.</p>
<ul>
<li>Hafif: pH 7.2-7.3 | Orta: 7.1-7.2 | Ağır: &lt;7.1</li>
</ul>
<p><strong>Tedavi:</strong></p>
<ol class="content" style="padding-left:18px">
<li>IV SIVI: 10-20 mL/kg SF bolus → defisit+idame 24-48 saate yay</li>
<li>Sıvıdan 1-2 SAAT SONRA insülin: Regular insülin <strong>0.05-0.1 Ü/kg/saat IV. ASLA BOLUS VERMEZ!</strong></li>
<li>KŞ takibi: SAATLIK. Düşüş saatte &lt;%10 ve &lt;90 mg/dL olmamalı</li>
<li>K+&lt;3.3 → <strong>İNSÜLİN BAŞLAMA,</strong> önce K+ replasmanı</li>
<li>KŞ&lt;300 düşünce → sıvıya %5-10 Dex ekle → insülini KESME!</li>
</ol>
<p><strong>Beyin Ödemi (EN KORKULAN KOMPLİKASYON):</strong></p>
<ul>
<li>Mekanizma: KŞ ve Na hızla düşer → plazma osmolaritesi↓ → beyin hücreleri su çeker</li>
<li>Bulgular: Baş ağrısı, bilinç değişikliği, kusma, Cushing triadı (bradikardi+HT+düzensiz solunum)</li>
<li>Tedavi: Mannitol 0.5-1 g/kg IV veya %3 NaCl 2.5-5 mL/kg</li>
</ul>
<h4 class="h-section">💡 DKA — Sık Sorulan Detaylar</h4>
<div class="info-box"><strong>Glukoz eşiği neden 200'e düştü?</strong> (Embiya hoca soruyor!)<br>
Glukozüri böbrekte 200 mg/dL'de başlar. Bu değerin altında glukoz idrarla çıkamaz, ketonemi devam ediyorsa DKA olarak kabul edilir. Eski eşik 300 mg/dL'ydi, artık &gt;200 mg/dL DKA kriteridir.</div>
<div class="info-box"><strong>Beyin ödemi önleme (Embiya hoca!):</strong><br>
• Sıvıyı çok hızlı verme → yavaş yavaş (48 saate yay)<br>
• KŞ düşüşü: saatte &lt;%10 ve &lt;90 mg/dL düşürme<br>
• Düzeltilmiş Na izle: tedavi boyunca artmalı, azalıyorsa beyin ödemi!</div>
`},{id:31,cat:'endokrin',priority:3,title:'Konjenital Hipotiroidi',tags:'hipotiroidi,TSH,levotiroksin,ektopik,tarama,guatr,makroglossi',content:`
<p><strong>Etyoloji (Mukaddes, Gülay en az 5 neden!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Ektopik tiroid (EN SIK! ~%60): Lingual, sublingual, substernal</li>
<li>Tiroid agenezisi/hipoplazisi (~%15)</li>
<li>Dishormonogenez (~%15): TPO eksikliği en sık. <strong>GUATR EŞLİK EDEBİLİR!</strong></li>
<li>Geçici: Maternal antikorlar, iyot eksikliği/fazlalığı, antitiroid ilaç</li>
<li>Santral hipotiroidi: Hipofizer TSH eksikliği. <em>SADECE TSH bakılırsa KAÇIRILIR!</em> (TSH normal/düşük, sT4 düşük)</li>
</ol>
<p><strong>Klinik:</strong> Uzamış sarılık (EN ERKEN İPUCU!), beslenme güçlüğü, kabızlık, letarji, az ağlama, <strong>MakroGLOSSİ</strong>, göbek fıtığı, kaba boğuk ağlama, livedo retikülaris, geniş arka fontanel, büyüme geriliği, hipotoni. Tedavisiz → <em>KALICI MENTAL RETARDASYON</em></p>
<p><strong>Tanı:</strong> TSH↑ + sT4↓ = primer hipotiroidi. USG → sintigrafi (Tc-99m).</p>
<p><strong>Tedavi:</strong> Levotiroksin <strong>10-15 μg/kg/gün.</strong> Açkarnına, sabah, soya formülü/demir/kalsiyum ile VERME (emilim bozar). 3 yaşta deneme kesimi.</p>
`},{id:32,cat:'endokrin',priority:2,title:'Graves / Hipertiroidi + Tiroid Fırtınası',tags:'Graves,Hashimoto,metimazol,TSI,propranolol,tiroid fırtınası,Lugol,ekzoftalmus',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Graves</th><th>Hashimoto</th></tr></thead>
<tbody>
<tr><td>TFT</td><td>TSH↓↓, sT3/sT4↑↑</td><td>TSH↑ (hipotiroidi)</td></tr>
<tr><td>Antikorlar</td><td>TSI/TRAb(+) (TSH reseptörünü UYARIR!)</td><td>Anti-TPO(+), Anti-Tg(+)</td></tr>
<tr><td>Guatr</td><td>Diffüz, üfürüm (hipervasküler!)</td><td>Diffüz, sert, lastik kıvam</td></tr>
<tr><td>Özel</td><td>EKZOFTALMİ, pretibial miksödem, lid lag</td><td>Yok</td></tr>
</tbody>
</table></div>
<p><strong>Tedavi:</strong></p>
<ol class="content" style="padding-left:18px">
<li>Beta-blokör (İLK VERİLEN!): Propranolol 0.5-2 mg/kg/gün</li>
<li>Antitiroid: METİMAZOL 0.5-1 mg/kg/gün. <em>Yan etki: agranülositoz (%0.3, ateş+boğaz ağrısı → acil hemogram!)</em></li>
<li>Definitif: RAI ablasyonu veya cerrahi → ömür boyu levotiroksin</li>
</ol>
<p><strong>Tiroid Fırtınası sırası:</strong></p>
<ol class="content" style="padding-left:18px">
<li>IV propranolol</li>
<li>PTU yükleme</li>
<li>Lugol (PTU'DAN 1 SAAT SONRA! Önce sentezi blok, sonra iyot — yoksa Jod-Basedow)</li>
<li>Steroid</li>
<li>Soğutma (<strong>ASPİRİN VERME!</strong> → T4 serbest bırakır)</li>
</ol>
<h4 class="h-section">🔎 Hipertiroidi Etyolojisi (Mukaddes — 10 neden istiyor!)</h4>
<ol class="content" style="padding-left:18px">
<li>Graves hastalığı (en sık çocukta, TSI/TRAb(+))</li>
<li>Toksik nodüler guatr (tek veya multipl adenom)</li>
<li>Hashitoksikoz (Hashimoto başlangıcında geçici hipertiroidi)</li>
<li>Subakut tiroidit (De Quervain) — ağrılı, viral sonrası</li>
<li>Sessiz tiroidit (ağrısız)</li>
<li>İyatrojenik (aşırı levotiroksin)</li>
<li>Ekzojen iyot yükü (Jod-Basedow)</li>
<li>TSH salgılayan <strong>hipofiz adenomu</strong> (TSH↑ + hipertiroidi = nadir ama önemli!)</li>
<li>İnsan koryonik gonadotropin (HCG) — gebelik, gestasyonel tirotoksikoz</li>
<li>Metastatik tiroid kanseri (foliküler)</li>
</ol>
<div class="info-box"><strong>Tip:</strong> Mukaddes hoca 5-10 neden istiyor. İlk 5'i mutlaka bil: Graves, toksik adenom, hashitoksikoz, subakut tiroidit, ekzojen alım + hipofiz adenomu</div>
`},{id:33,cat:'endokrin',priority:3,title:'Poliüri/Polidipsi + SIADH vs Santral Dİ',tags:'poliüri,SIADH,Dİ,desmopressin,hiponatremi,hipernatremi,ADH',content:`
<p><strong>Poliüri Nedenleri:</strong> DM (KŞ↑), Santral Dİ (ADH eksikliği), Nefrojenik Dİ (ADH'ye yanıtsız), Hiperkalsemi (Ca↑), Hipokalemi</p>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>SIADH</th><th>Santral Dİ</th></tr></thead>
<tbody>
<tr><td>Na</td><td>↓ (hiponatremi)</td><td>↑ (hipernatremi)</td></tr>
<tr><td>Serum osmolarite</td><td>↓</td><td>↑</td></tr>
<tr><td>İdrar osmolarite</td><td>↑ (konsantre — AYKIRI!)</td><td>↓ (dilüe)</td></tr>
<tr><td>Tedavi</td><td>Su kısıtlama</td><td>Desmopressin</td></tr>
</tbody>
</table></div>
<p><strong>Hiperkalsemi Tedavisi:</strong> ①IV SF hidrasyon ②Furosemid ③Kalsitonin ④Bifosfonatlar ⑤Steroid</p>
<div class="warn">Hiperkalsemi EKG: QT KISALMASI. SF kullan! Ringer laktat değil (Ca içeriyor!). Hipokalemi ise QT uzar — karıştırma!</div>
<div class="warn">Hiponatremi/Hipernatremiyi HIZLI düzeltmeyin → günde ≤10-12 mEq/L!</div>
`},{id:34,cat:'endokrin',priority:1,title:'Boy Kısalığı',tags:'boy,kısalık,büyüme,GH,Turner,endokrin,kemik yaşı',content:`
<p><strong>Tanım:</strong> Boy &lt;3. persentil veya büyüme hızı &lt;5 cm/yıl.</p>
<p><strong>Normal Varyant:</strong></p>
<ul>
<li>Ailesel: Kemik yaşı = kronolojik, son boy kısa</li>
<li>Yapısal büyüme gecikmesi: Kemik yaşı &lt; kronolojik, puberte geç, son boy normal</li>
</ul>
<p><strong>Patolojik:</strong> GH eksikliği, hipotiroidi, Cushing, kronik hastalık (çölyak, KBY), Turner (45X — <em>her kısa kızda!</em>), iskelet displazisi</p>
<p><strong>Sınıflama:</strong></p>
<ul>
<li><strong>Orantılı:</strong> Endokrin (GH eksikliği, hipotiroidi, KAH, Cushing), Beslenme, Kronik hastalık (çölyak, RTA, kalp, böbrek), Sendromik (Turner, Noonan), Psikososyal</li>
<li><strong>Orantısız:</strong> Kemik displazileri (akondroplazi), rikets</li>
</ul>
<p><strong>Endokrin Boy Kısalığı Ayırt Etme:</strong></p>
<ul>
<li>Kemik yaşı geride + büyüme hızı düşük → <strong>GH eksikliği</strong> (IGF-1 düşük)</li>
<li>Hipotiroidi: TSH↑, FT4↓ → Levotiroksin</li>
<li>Cushing: Kortizol↑, büyüme geride fakat kilo artışı var</li>
<li><strong>Turner (45,X0):</strong> Kız, kısa boy, gonadal disgenezi, kalkan göğüs, pterigium koli, kardiyak (<em>aort koarktasyonu!</em>), horseshoe kidney. Tedavi: GH + östrojen</li>
</ul>
<p><strong>GH Eksikliği Tanı:</strong></p>
<ul>
<li>Stimülasyon testleri: İnsülin hipoglisemi testi veya arjinin testi</li>
<li>GH &lt;10 μg/L: Yetersiz yanıt</li>
<li>Tedavi: Rekombinant GH (0.025-0.05 mg/kg/gün SC)</li>
</ul>
<div class="pearl">Akondroplazi: FGFR3 mutasyonu. OD. Rizomelik kısa ekstremite (proksimal), büyük baş, normal zeka. Trident el.</div>
<p><strong>Endokrine Sevk:</strong> ①Boy &lt;3. persentil ②Büyüme hızı &lt;25. persentilden az ③Pubertal atlama yok ④Tüm tetkikler normal ama boy kısa</p>
<p><strong>Tetkikler:</strong> Büyüme eğrisi, kemik yaşı (sol el-bilek X-ray), TFT, çölyak (tTG IgA), IGF-1, karyotip (kız!)</p>
`},{id:35,cat:'noro',priority:2,title:'Hipotonik İnfant + Serebral Palsi + SMA',tags:'hipotoni,SMA,serebral palsi,DTR,fasikülasyon,Babinski,kurbağa,traksiyon',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Santral Hipotoni</th><th>Periferik Hipotoni</th></tr></thead>
<tbody>
<tr><td>Neden</td><td>SP, Down, hipotiroidi, Prader-Willi</td><td>SMA, miyopati, miyasteni</td></tr>
<tr><td>DTR</td><td>Normal/↑</td><td>↓/kayıp</td></tr>
<tr><td>Fasikülasyon</td><td>Yok</td><td><strong>VAR (SMA'da DİLDE!)</strong></td></tr>
</tbody>
</table></div>
<p><strong>3 Hipotoni Muayenesi (Beril MUTLAKA soruyor!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Traksiyon: Kollardan çek → baş arkaya düşer</li>
<li>Vertikal süspansiyon: Koltuk altından tut → "kayar"</li>
<li>Horizontal: Yüzüstü tut → "ters U" sarkar</li>
</ol>
<p>Ortak: "Kurbağa pozisyonu"</p>
<p><strong>SMA Tip 1:</strong> 5q13 SMN1 gen delesyonu. OR. Doğum/ilk 6 ay. Ciddi hipotoni, kurbağa pozisyonu, DİLDE FASİKÜLASYON, arefleksi. Tedavi: Nusinersen (intratekal), Onasemnogene (&lt;2 yaş), Risdiplam (oral).</p>
<p><strong>Serebral Palsi:</strong> FM → hipertoni, spastisite, hiperrefleksi, Babinski(+). SP'den uzaklaştıran: aile/kardeş öyküsü (genetik/metabolik düşün!).</p>
<p><strong>Babinski:</strong> 18 aya kadar fizyolojik. <em>Asimetrik Babinski = HER YAŞTA PATOLOJİK!</em></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>ÜMN</th><th>AMN</th></tr></thead>
<tbody>
<tr><td>Tonus</td><td>Spastisite</td><td>Flask</td></tr>
<tr><td>DTR</td><td>↑</td><td>↓/kayıp</td></tr>
<tr><td>Babinski</td><td>(+)</td><td>(-)</td></tr>
<tr><td>Fasikülasyon</td><td>Yok</td><td>VAR</td></tr>
</tbody>
</table></div>
<h4 class="h-section">🧠 Serebral Palsi — Yaklaşım</h4>
<p><strong>SP Etiyolojisi (5 Madde — Ali Cansu/Beril soruyor!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>HIE (Hipoksik-iskemik ensefalopati) — EN SIK! Perinatal asfiksi</li>
<li>Prematürite + İVK (intraventriküler kanama)</li>
<li>Merkezi sinir sistemi enfeksiyonu (menenjit, ensefalit)</li>
<li>Merkezi sinir sistemi travması (doğum travması, NAT)</li>
<li>Metabolik: ciddi hipoglisemi, hiperbilirübinemi (kernikterus)</li>
</ol>
<div class="danger-box"><strong>SP'DEN UZAKLAŞTIRAN BULGULAR (Ali Cansu soruyor — çok puanlı!):</strong>
<ul>
<li>Aile veya kardeş öyküsü → Genetik/metabolik hastalık düşün!</li>
<li>Progresif kötüleşme → SP statiktir, kötüleşmez!</li>
<li>Dismorfik özellikler → kromozom anomalisi</li>
<li>Metabolik kriz öyküsü → metabolik hastalık</li>
</ul>
</div>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Hipotonik Bebek FM</th><th>Hipertonik Bebek FM</th></tr></thead>
<tbody>
<tr><td>Tonus</td><td>Flask, pelte gibi</td><td>Spastisite, sertlik</td></tr>
<tr><td>DTR</td><td>↓/kayıp (periferik) veya normal (santral)</td><td>↑↑ Hiperrefleksi</td></tr>
<tr><td>Babinski</td><td>- (periferik) veya + (santral)</td><td>+ (patolojik)</td></tr>
<tr><td>Priz</td><td>Parmak aralarından kayıyor</td><td>Kenetleniyor, spastik</td></tr>
<tr><td>Tanı ipucu</td><td>Dil fasikülasyonu → SMA!</td><td>Asimetrik Babinski → HER YAŞTA patolojik</td></tr>
</tbody>
</table></div>
<p><strong>SP Tedavisi (Ayşenur Bahadır soruyor — 4 alan!):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Fizik tedavi ve rehabilitasyon (botulinum toksini, cerrahi - seçilmiş)</li>
<li>Beslenme takibi (yutma güçlüğü → NG tüp/PEG)</li>
<li>Psikolojik destek (çocuk + aile)</li>
<li>Nörolojik takip — EPİLEPSİ RİSKİ! (%25-50)</li>
</ol>
<div class="info-box"><strong>SMA Tanı için ek tetkik (Burcu Güven soruyor):</strong> Kreatin Kinaz (CK) — SMA'da normal veya hafif yüksek. Miyopatide çok yüksek! SMN1 genetik testi kesin tanı. Prenatal tanı: Amniyosentez VEYA <strong>Koryon Villus Biyopsisi</strong> (10-13. hf, daha erken!)</div>
`},{id:36,cat:'noro',priority:1,title:'Serebellar Ataksi + 11 Muayene Bulgusu',tags:'serebellar,ataksi,romberg,disdiadokokinezi,nistagmus,dismetri,tremor',content:`
<p><strong>11 Serebellar Muayene Bulgusu (Beril slaytı):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Ataksik yürüyüş (geniş tabanlı)</li>
<li><strong>Romberg NEGATİF</strong> (propriyosepsiyon normal, serebellar)</li>
<li>Parmak-burun testi (dismetri)</li>
<li>Topuk-diz testi</li>
<li>Disdiadokokinezi</li>
<li>İntansiyon tremoru (hedefe yaklaştıkça artar)</li>
<li>Nistagmus</li>
<li>Dizartri (patlayıcı konuşma)</li>
<li>Hipotoni</li>
<li>Rebound fenomeni</li>
<li>Geniş adım</li>
</ol>
<p><strong>Akut Ataksi Nedenleri (Yaşa Göre):</strong></p>
<ul>
<li><strong>Akut postenfeksiyöz serebellar ataksi:</strong> En sık! (Varisella sonrası %1/4000)
  <ul>
    <li>Özellikleri: İyi genel durum, MRI genellikle normal, 1-3 ayda düzelir</li>
  </ul>
</li>
<li><strong>İntoksikasyon:</strong> Alkol, fenitoin, barbitürat, antihistaminikler</li>
<li><strong>Posterior fossa tümörü:</strong> MUTLAKA MRI ile dışla!
  <ul>
    <li>Medülloblastom: Çocukta en sık malign beyin tümörü, serebellum</li>
    <li>Astrositom: Serebellar, iyi prognoz, kistik+solid</li>
  </ul>
</li>
<li><strong>Guillain-Barré:</strong> Miller-Fisher varyantı (ataksi+oftalmopleji+arefleksi)</li>
</ul>
<p><strong>Kronik/Tekrarlayan Ataksi:</strong></p>
<ul>
<li><strong>Friedreich ataksi:</strong> OR, spinoserebellar, 5-15 yaş, kardiomiyopati, diyabetes, pes kavus</li>
<li><strong>Ataksi-Telanjiektazi:</strong> OR, ATM geni, IgA eksikliği, oküler telanjiektazi, kanser riski (lenfoma)</li>
</ul>
<div class="pearl">"4 yaş, ataksik yürüyüş, 2 hf önce su çiçeği" → Akut postenfeksiyöz serebellar ataksi. MRG ile posterior fossa tümörü MUTLAKA dışla!</div>
<p><strong>Not:</strong> Ali Cansu intansiyon tremoru ve Romberg'i özellikle soruyor.</p>
`},{id:37,cat:'noro',priority:2,title:'İskemik İnme + Febril Konvülsiyon',tags:'inme,stroke,febril,konvülsiyon,LP,profilaksi',content:`
<p><strong>İskemik İnme:</strong></p>
<ul>
<li>Etyoloji: Kardiyoembolik (KKH — EN SIK!), orak hücreli, vaskülît, protrombotik</li>
<li>Acil BT → kanama dışla. Difüzyon MRI → erken iskemi</li>
<li>Tedavi: Oral alımı kapat, yatak başı 30°, KİBAS → mannitol</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Basit Febril Konvülsiyon</th><th>Komplike Febril Konvülsiyon</th></tr></thead>
<tbody>
<tr><td>Süre</td><td>&lt;15 dk</td><td>&gt;15 dk</td></tr>
<tr><td>Tip</td><td>Jeneralize</td><td>Fokal olabilir</td></tr>
<tr><td>24 sa tekrar</td><td>Hayır</td><td>Evet</td></tr>
<tr><td>Epilepsi riski</td><td>%1-2</td><td>%4-12</td></tr>
</tbody>
</table></div>
<p><strong>Akut tedavi</strong> (&gt;5 dk): Diazepam 0.3 mg/kg IV / 0.5 mg/kg rektal</p>
<p><strong>LP endikasyonu:</strong> &lt;12 ay, meningeal irritasyon, komplike, AB almış</p>
<div class="warn">BFK'da profilaktik antiepileptik ÖNERİLMEZ!</div>
`},{id:38,cat:'enfeksiyon',priority:2,title:'Menenjit — BOS + Tedavi',tags:'menenjit,BOS,Kernig,Brudzinski,seftriakson,deksametazon,Listeria',content:`
<p><strong>Meningeal İrritasyon (Ali Cansu kurtarma!):</strong></p>
<ul>
<li>Ense sertliği: Baş öne eğilince direnç</li>
<li>Kernig: Kalça+diz 90°, diz ekstansiyona → direnç + ağrı</li>
<li>Brudzinski: Baş öne eğince kalça+diz refleks fleksiyon</li>
<li>&lt;1 yaş: Bu bulgular alınamayabilir → <strong>FONTANELBOMBELİĞİ en önemli bulgu</strong></li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>BOS</th><th>Normal</th><th>Bakteriyel</th><th>Viral</th><th>TB</th></tr></thead>
<tbody>
<tr><td>Görünüm</td><td>Berrak</td><td>BULANIK</td><td>Berrak</td><td>Berrak/hafif</td></tr>
<tr><td>Hücre</td><td>&lt;5/mm³</td><td>↑↑ Nötrofil</td><td>↑ Lenfosit</td><td>↑ Lenfosit</td></tr>
<tr><td>Protein</td><td>&lt;40 mg/dL</td><td>↑↑ (&gt;100)</td><td>N/hafif↑</td><td>↑↑</td></tr>
<tr><td>Glukoz (BOS/serum)</td><td>&gt;0.6</td><td>↓↓ (&lt;0.4)</td><td>Normal</td><td>↓</td></tr>
</tbody>
</table></div>
<p><strong>Tedavi:</strong></p>
<ul>
<li>LP BEKLENMEden başla!</li>
<li>0-3 ay: Ampisilin + Sefotaksim (Listeria + Gram(-) kapsama)</li>
<li>&gt;3 ay: <strong>SEFTRİAKSON + VANKOMİSİN</strong> (dirençli pnömokok!)</li>
<li>Deksametazon: İlk AB dozundan <strong>15-30 dk ÖNCE başla,</strong> 4 gün. İşitme kaybını azaltır (H.influenzae'de)</li>
<li>Meningokok profilaksisi: Yakın temaslılara rifampisin 2 gün</li>
</ul>
<h4 class="h-section">🔎 Etkenler Yaşa Göre</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Yaş</th><th>En Sık Etkenler</th><th>Empirik AB</th></tr></thead>
<tbody>
<tr><td>0-3 ay</td><td>GBS, E.coli, Listeria, Klebsiella</td><td>Ampisilin + Sefotaksim</td></tr>
<tr><td>3 ay - 5 yaş</td><td>N.meningitidis, S.pneumoniae, H.influenzae tip b</td><td>Seftriakson + Vankomisin</td></tr>
<tr><td>&gt;5 yaş</td><td>N.meningitidis (en sık!), S.pneumoniae</td><td>Seftriakson + Vankomisin</td></tr>
</tbody>
</table></div>
<h4 class="h-section">⚠️ LP Kontrendikasyonları</h4>
<ul>
<li>Papilödem / fokal nörolojik defisit → önce BT!</li>
<li>Bilinç bozukluğu (GKS &lt;8)</li>
<li>Trombositopeni &lt;50.000, koagülopati</li>
<li>Cilt enfeksiyonu LP bölgesinde</li>
<li>Kardiyorespiratuvar instabilite</li>
</ul>
<div class="danger-box">LP yapılamazsa: Kan kültürü al → AB BAŞLA → BT → sonra LP. AB başlanması BOS kültürünü olumsuz etkileyebilir ama <strong>AB'yi GECİKTİRME!</strong></div>
<h4 class="h-section">🦠 HSV Ensefaliti</h4>
<ul>
<li>Temporal lob tutulumu, MRI T2/DWI pozitif</li>
<li>BOS: HSV PCR</li>
<li>Klinik: Ateş + davranış değişikliği + fokal bulgu + temporal lezyon</li>
<li><strong>Asiklovir BAŞLA:</strong> 20 mg/kg/doz IV 8 saatte 1 (max 60 mg/kg/gün), 14-21 gün</li>
<li>Şüphede bile başla! Geç tedavi mortalite↑</li>
</ul>
`},{id:39,cat:'enfeksiyon',priority:3,title:'ARA — Jones 2015 + Tedavi',tags:'ARA,Jones,romatizmal,kardit,korea,sekonder profilaksi,GAS,Sydenham',content:`
<p><strong>Tanı:</strong> Streptokok enfeksiyon kanıtı (ZORUNLU!) + 2 majör VEYA 1 majör + 2 minör</p>
<p><strong>Majör Kriterler:</strong></p>
<ol class="content" style="padding-left:18px">
<li>Kardit (pankardit): <strong>EN CİDDİ + KALICI SEKEL!</strong> Endokardit (EN SIK MİTRAL), miyokardit, perikardit. EKO mutlaka!</li>
<li>Artrit: Gezici poliartrit (büyük eklemler). TÜRKİYE orta-yüksek risk → aseptik monoartrit de majör!</li>
<li>Sydenham Koresi: 2-6 ay sonra. İstemsiz hareketler. <strong>TEK BAŞINA TANI KOYDURUR!</strong></li>
<li>Eritema marginatum: Halkamsı, merkezleri soluk, gövde. Banyoyla belirginleşir</li>
<li>Subkutan nodüller: Sert, ağrısız, kemik çıkıntıları. Ağır kardit ile ilişkili</li>
</ol>
<p><strong>Minör Kriterler (Türkiye orta-yüksek):</strong> Monoartralji, Ateş &gt;38°C, ESR&gt;30 veya CRP&gt;3, PR uzaması</p>
<p><strong>Tedavi:</strong></p>
<ul>
<li>GAS eradikasyon: Benzatin PG G tek doz IM (600.000 Ü &lt;27 kg; 1.200.000 Ü ≥27 kg)</li>
<li>Artrit: Aspirin 80-100 mg/kg/gün (dramatik yanıt!)</li>
<li>Kardit (ağır): Prednizolon 2 mg/kg/gün ×2-3 hf</li>
<li>Sekonder profilaksi: Benzatin PG IM her 3-4 hf. Kardit+kapak hasarı → 10 yıl veya 40 yaşa. Kardit yok → 21 yaşa veya son ataktan 5 yıl</li>
</ul>
<div class="pearl">ESR açılımı: Erythrocyte Sedimentation Rate (Yakup sormuş!)</div>
`},{id:40,cat:'enfeksiyon',priority:2,title:'Aşı Takvimi',tags:'aşı,KKK,takvim,kontrendikasyon,IVIG,HepB,BCG',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Yaş</th><th>Aşılar</th></tr></thead>
<tbody>
<tr><td>Doğum</td><td>HepB 1, BCG</td></tr>
<tr><td>1. ay</td><td>HepB 2</td></tr>
<tr><td>2. ay</td><td>6'lı karma 1, KPA 1</td></tr>
<tr><td>4. ay</td><td>6'lı karma 2, KPA 2</td></tr>
<tr><td>6. ay</td><td>6'lı karma 3, KPA 3, OPA 1</td></tr>
<tr><td><strong>9. ay</strong></td><td><strong>KKK 1 (GÜNCELLEME!)</strong></td></tr>
<tr><td>12. ay</td><td>KPA rapel, HepA 1, Su çiçeği 1</td></tr>
<tr><td>15. ay</td><td>KKK rapel</td></tr>
<tr><td>18. ay</td><td>5'li karma rapel, OPA 2, HepA 2</td></tr>
</tbody>
</table></div>
<ul>
<li>IVIG sonrası canlı aşılar 5-11 ay ertelenir</li>
<li><strong>Kesin kontrendikasyon:</strong> Önceki dozda anafilaksi. Canlı aşılar: ağır immün yetmezlik, gebelik</li>
<li><strong>YANLIŞ kontrendikasyon (YAPILIR!):</strong> Hafif hastalık, AB, prematürite, anne sütü, ailede konvülsiyon</li>
</ul>
`},{id:41,cat:'enfeksiyon',priority:2,title:'Pnömoni + Tüberküloz + Bronşiolit',tags:'pnömoni,tüberküloz,TB,RSV,streptococcus,INH,rifampisin,bronşiolit,palivizumab,wheezing,FM,oskültasyon,grafi',content:`
<div class="warn"><strong>Fazıl Orhan:</strong> "Kılavuz yetersiz!" — FM bulguları + grafi yorumunu detaylı biliyor olmanızı bekliyor!</div>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Viral Pnömoni</th><th>Bakteriyel Pnömoni</th><th>Atipik (M.pneumoniae)</th></tr></thead>
<tbody>
<tr><td>Başlangıç</td><td>Yavaş, ÜSYE sonrası</td><td>Ani, yüksek ateş &gt;39°C</td><td>Sinsi, hafif ateş, kuru öksürük</td></tr>
<tr><td><strong>FM (oskültasyon)</strong></td><td>Bilateral wheezing, faint krepitan</td><td><strong>Tek taraf krepitan ral</strong>, perküsyonda matite, nefes sesi ↓</td><td>Diffüz krepitan, wheeze</td></tr>
<tr><td><strong>Grafi</strong></td><td>Peribronşiyal tutulum, hiperinflasyon</td><td><strong>Lober/segmenter konsolidasyon</strong>, plevral sıvı olabilir</td><td>İnterstisyel (retiküler), diffüz bilateral</td></tr>
<tr><td>Etken</td><td>RSV (&lt;2 yaş), Influenza, Para-influenza</td><td>S.pneumoniae (en sık!); &lt;3 ay: GBS, Listeria</td><td>&gt;5 yaş: M.pneumoniae, C.pneumoniae</td></tr>
<tr><td>Tedavi</td><td>Destek (AB YOK!)</td><td>Amoksisilin 80-90 mg/kg/gün</td><td>Azitromisin 10 mg/kg/gün ×5 gün</td></tr>
</tbody>
</table></div>
<h4 class="h-section">🔍 Fizik Muayene Bulguları — Detay (Fazıl için!)</h4>
<ul>
<li><strong>İnspeksiyon:</strong> Takipne (en hassas ve özgül bulgu!), subkostal/interkostal/supraklaviküler retraksiyon, burun kanadı solunumu, siyanoz (ağır)</li>
<li><strong>Perküsyon:</strong> Konsolidasyon olan bölgede <strong>matite</strong> (sıvı olunca da matite!)</li>
<li><strong>Oskültasyon:</strong> Konsolidasyon → <strong>krepitan ral + bronşiyal solunum sesi + egofoni</strong>. Plevral efüzyon → o bölgede nefes sesleri ↓↓</li>
<li><strong>Egofoni:</strong> Hasta "E" der, doktor "A" duyar → Konsolidasyon kanıtı</li>
</ul>
<h4 class="h-section">📸 Grafi Yorumu (Akciğer)</h4>
<ul>
<li><strong>Lober konsolidasyon (bakteriyel):</strong> Homojen opasite, hava bronkogramı (+), konsolidasyonun kenarından sınır belli</li>
<li><strong>Hava bronkogramı:</strong> Parankimde konsolidasyon varken bronşlar hava içerdiğinden görünür hale gelir → pnömoni kanıtı</li>
<li><strong>Plevral efüzyon:</strong> Kostafrenik sinüs küntleşmesi, kostalar arası mesafe artışı, masif olunca mediastinal itmesi</li>
<li><strong>Hiperinflasyon (bronşiolit/astım):</strong> Diyafragma düzleşmesi, AP çap artışı, 10-11 posteriors kosta sayılır</li>
<li><strong>İnterstisyel (viral/atipik):</strong> Peribronşiyal işaretlenme artışı, retiküler görünüm, diffüz bilateral</li>
</ul>
<p><strong>Tüberküloz:</strong></p>
<ul>
<li>Çocukta paucibacillary. TST: ≥15mm normal; ≥5mm immünsüprese; ≥10mm orta risk</li>
<li>Tedavi: 2 ay İNH+RİF+PZA+ETB → 4 ay İNH+RİF. <strong>İNH ile B6 VER!</strong></li>
<li><em>Nefrotik sendromda steroid başlamadan TB DIŞLA!</em></li>
</ul>
<h4 class="h-section">💊 Antibiyotik Dozları</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>İlaç</th><th>Doz</th><th>Max Doz</th><th>Süre</th></tr></thead>
<tbody>
<tr><td>Amoksisilin (hafif)</td><td>80-90 mg/kg/gün, 3×</td><td>3 g/gün</td><td>5-7 gün</td></tr>
<tr><td>Amoksisilin-Klav.</td><td>80-90 mg/kg/gün (amoks. baz), 2-3×</td><td>3 g/gün amoks.</td><td>7-10 gün</td></tr>
<tr><td>Azitromisin (atipik)</td><td>10 mg/kg/gün 1×</td><td>500 mg/gün</td><td>5 gün</td></tr>
<tr><td>Ampisilin (yatış)</td><td>200 mg/kg/gün, 4× IV</td><td>12 g/gün</td><td>7-10 gün</td></tr>
<tr><td>Seftriakson (ağır)</td><td>50-75 mg/kg/gün, 1× IV</td><td>2-4 g/gün</td><td>7-14 gün</td></tr>
</tbody>
</table></div>
<h4 class="h-section">🔬 Tüberküloz — Detay</h4>
<ul>
<li>TST (Tüberkülin/Mantoux): &gt;5 mm immünsüprese/yakın temas; &gt;10 mm orta risk; &gt;15 mm düşük risk. BCG'den etkilenir!</li>
<li>IGRA (Quantiferon): BCG'den etkilenmez, ≥2 yaşta tercih</li>
<li>Aktif TB tanı: Klinik + radyoloji + kültür (altın standart, 6-8 hf)</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>İlaç</th><th>Doz</th><th>Max Doz/gün</th><th>Süre</th><th>Yan Etki</th></tr></thead>
<tbody>
<tr><td>İzoniazid (İNH)</td><td>10-15 mg/kg/gün</td><td>300 mg</td><td>6-9 ay</td><td>Hepatit, periferik nöropati</td></tr>
<tr><td>Rifampisin (RİF)</td><td>10-20 mg/kg/gün</td><td>600 mg</td><td>6 ay</td><td>Turuncu idrar/gözyaşı, hepatit</td></tr>
<tr><td>Pirazinamid (PZA)</td><td>30-40 mg/kg/gün</td><td>2 g</td><td>2 ay</td><td>Hepatit, gut</td></tr>
<tr><td>Etambutol (ETB)</td><td>15-25 mg/kg/gün</td><td>1.2 g</td><td>2 ay</td><td>Optik nörit (renk görme bozukluğu)</td></tr>
</tbody>
</table></div>
<div class="info-box"><strong>İNH profilaksi (latent TB):</strong> 9 ay İNH monoterapi. Piridoksin (B6) ekle: 6-25 mg/gün (periferik nöropati önleme)</div>
<div class="warn">Nefrotik sendromda + steroid → TB riski! Steroid başlamadan tüberkülin testi yap!</div>
<h4 class="h-section">🫁 Bronşiolit (RSV) — Tam Klinik Tablo</h4>
<p><strong>Bronşiolit =</strong> &lt;2 yaş, ilk atak, viral etkenle alt solunum yolu iltihabı. <strong>RSV en sık (%60-80), kış.</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Evre</th><th>Klinik</th></tr></thead>
<tbody>
<tr><td>Başlangıç (1-3. gün)</td><td>Burun akıntısı, hafif öksürük, düşük ateş (37.5-38.5°C)</td></tr>
<tr><td>Pik (3-5. gün)</td><td><strong>Wheezing + takipne + retraksiyonlar (subcostal/interkostal) + hiperinflasyon</strong></td></tr>
<tr><td>Hiperinflasyon</td><td>Göğüs AP çapı artar, diyafragma düzleşir, havalanma artışı (GRAFIDE!)</td></tr>
<tr><td>Beslenme bozukluğu</td><td>Solunum işi arttığı için emmez, ağızdan beslenemiyor → NG gerekebilir</td></tr>
</tbody>
</table></div>
<div class="tbl-wrap"><table>
<thead><tr><th>Risk Faktörü</th><th>Hastaneye Yatış Endikasyonu</th></tr></thead>
<tbody>
<tr><td>&lt;3 ay</td><td>SpO₂ &lt;%92 oda havasında</td></tr>
<tr><td>Prematüre (&lt;35 hf)</td><td>Beslenemiyor (dehidrasyon riski)</td></tr>
<tr><td>Kronik akciğer hastalığı (BPD)</td><td>Apne atakları (özellikle &lt;2 ay)</td></tr>
<tr><td>Konjenital kalp hastalığı (KKH)</td><td>Toksik görünüm, hızlı kötüleşme</td></tr>
<tr><td>İmmünyetmezlik</td><td>Ebeveyn bakım kapasitesi yetersiz</td></tr>
</tbody>
</table></div>
<p><strong>Tedavi:</strong></p>
<ul>
<li><strong>Destek tedavisi → YEGANE TEDAVİ!</strong> Bronşiolitte antibiyotik, sistemik steroid, salbutamol rutin önerilmez</li>
<li>Oksijen: SpO₂ &lt;%92 ise nazal kanül (%100 O₂ gereksiz)</li>
<li>Sıvı/beslenme: Oral alımı varsa devam. Yoksa NG tüp veya IV sıvı</li>
<li>Nazal aspirasyon (serum fizyolojik ile): sekresyonları temizler</li>
<li>Tuzlu su nazal nebülizasyon (hipertonik %3 NaCl): hastanede yatış süresini kısaltabilir</li>
</ul>
<div class="info-box"><strong>Palivizumab (RSV Profilaksisi):</strong> Anti-RSV monoklonal antikor, ayda 1 IM. Endikasyon: &lt;35 hf prematüre (ilk 2 sezon) / KKH / BPD / immünyetmezlik. Viral enfeksiyonu tedavi etmez, önler!</div>
<div class="danger-box"><strong>⚠️ Bronşiolit ≠ Astım:</strong> İlk atak, &lt;2 yaş, kış, aile öyküsü yok = bronşiolit. Tekrarlayan wheezing + aile öyküsü = astım? ≥3 atak = rekürran bronşiolit → allerjist değerlendirmesi</div>
`},{id:42,cat:'gastro',priority:2,title:'Akut Pankreatit',tags:'pankreatit,amilaz,lipaz,NSAİİ,AB,ERCP',content:`
<p><strong>Tanı (3'ten 2'si yeter):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Karakteristik ağrı (epigastrik, kuşak tarzı, öne eğilince rahatlar)</li>
<li>Amilaz/lipaz <strong>≥3 KAT↑</strong></li>
<li>Görüntüleme (BT/MR)</li>
</ol>
<p><strong>Etyoloji (çocukta):</strong></p>
<ul>
<li><strong>İdyopatik</strong> (en sık çocukta!)</li>
<li>Travma (yüksek enerji kapsamı)</li>
<li>İlaç: <em>L-asparaginaz, valproat, steroid, azatiyoprin</em></li>
<li>Safra taşı (adolesanda)</li>
<li>Anatomik anomali (pankreas divisum)</li>
<li>Viral: Kabakulak, Coxsackie</li>
</ul>
<p><strong>Tedavi:</strong></p>
<ul>
<li>Erken oral beslenme güvenli (güncel kanıt!)</li>
<li>Agresif IV hidrasyon</li>
<li>Ağrı: Parasetamol veya opioid. <strong>NSAİİ VERİLMEZ!</strong></li>
<li>AB: Enfeksiyon yoksa <strong>VERİLMEZ!</strong> (rutin AB endikasyonu yok)</li>
<li>Ciddi vakalarda enteral beslenme (NG/NJ tüp)</li>
</ul>
<p><strong>Komplikasyonlar:</strong></p>
<ul>
<li><strong>Psödokist:</strong> 4-6 hf sonra. Görüntüleme izlem, çoğu kendiliğinden gerilir</li>
<li><strong>Nekrotizan pankreatit:</strong> BT/MR ile tanı. Enfekte nekroz → AB + drenaj</li>
<li>SIRS/Sepsis</li>
</ul>
<div class="pearl">ERCP: Safra taşına bağlı pankreatitte (obstrüksiyon varsa). Ağırlık skorlaması: APACHE II, Balthazar (BT skoru)</div>
`},{id:43,cat:'gastro',priority:2,title:'Kabızlık + Hirschsprung Ayrımı',tags:'kabızlık,Hirschsprung,PEG,konstipasyon,mekonyum,rektum',content:`
<p><strong>Hirschsprung vs Fonksiyonel Kabızlık:</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Hirschsprung</th><th>Fonksiyonel</th></tr></thead>
<tbody>
<tr><td>Başlangıç</td><td>Doğumdan beri, &gt;48 sa mekonyum</td><td>Genelde 2 yaştan sonra</td></tr>
<tr><td>Rektal muayene</td><td>Ampulla BOŞ + parmak çekince FIŞKIRMA</td><td>Ampulla dolu</td></tr>
<tr><td>Distansiyon</td><td>Belirgin</td><td>Hafif</td></tr>
</tbody>
</table></div>
<p><strong>Organik Dışla:</strong> Hirschsprung, Hipotiroidi, Hiperkalsemi, Çölyak, Spinal kord anomalisi</p>
<p><strong>Fonksiyonel Kabızlık Tedavisi:</strong></p>
<ul>
<li>Diyet (lif↑, sıvı↑), tuvalet eğitimi</li>
<li>İmpaksiyon varsa: PEG yüksek doz ile boşalt</li>
<li>İdame: PEG 3350 (0.5-1 g/kg/gün)</li>
<li>Süre: 3 hafta tedavi + 1 ay azaltarak kes</li>
</ul>
`},{id:44,cat:'alerji',priority:1,title:'Atopik Dermatit + Ürtiker',tags:'atopik,ürtiker,histamin,mast,antihistaminik,takrolimus,Th2,bariyer',content:`
<p><strong>Atopik Dermatit:</strong></p>
<ul>
<li>İnfant → yüz (yanak), ekstansör. Büyük → fleksural (antekübital, popliteal)</li>
<li>TUTULMAYAN: Aksiller, diaper bölge, burun çevresi</li>
<li>Patogenez (Fazıl!): Bariyer bozulması → Th2 → IL-4, IL-13 → Mast hücresi → histamin → vazodilatasyon+ödem+kaşıntı</li>
<li>Tedavi: ①Emolyan (temel!) ②Topikal KS (max 7-14 gün) ③Takrolimus ≥2 YAŞ (yüzde kullan!) ④Antihistaminik ⑤Tetikleyiciden kaçın</li>
</ul>
<p><strong>Ürtiker:</strong></p>
<ul>
<li>Baskıyla solan, 24 saatte yer değiştiren kabarıklıklar</li>
<li>Patogenez (Fazıl MUTLAKA soruyor!): Alerjen → IgE → <strong>MAST HÜCRESİ aktivasyonu</strong> → histamin → vazodilatasyon + kapiller permeabilite↑</li>
<li>Tedavi: 2. kuşak antihistaminik (setirizin, loratadin) 1. tercih</li>
</ul>
<h4 class="h-section">⚕️ AD Tedavi Basamakları</h4>
<ol class="content" style="padding-left:18px">
<li><strong>Emolyan (temel!):</strong> Banyo sonrası 3 dakika içinde uygula (nemliliği kilitle). Günde 2×</li>
<li><strong>Topikal kortikosteroid (akut bataklar):</strong> Hafif → Hidrokortizon %1 (yüz). Orta → Mometazon. Ağır → Betametazon (yüze sürme!). Max 7-14 gün</li>
<li><strong>Takrolimus/Pimekrolimus (kalsinörin inhibitörü):</strong> ≥2 yaş, hassas bölgeler (yüz!), uzun dönem güvenli</li>
<li><strong>Antihistaminik:</strong> Kaşıntı kontrolü (sedatif: Klemastin). Enfeksiyon varsa AB</li>
<li><strong>Ağır/dirençli:</strong> Dupilumab (IL-4Rα inhibitörü, ≥6 ay onaylı)</li>
</ol>
<h4 class="h-section">⚕️ Ürtiker — Tanı + Tedavi</h4>
<ul>
<li>Akut (&lt;6 hf): Viral (%40 çocukta), alerjik (gıda/ilaç), idyopatik</li>
<li>Kronik (&gt;6 hf): Kronik spontan ürtiker (çoğu idyopatik), fiziksel (dermatografizm, soğuk, basınç)</li>
<li>Anjiyoödem + nefes güçlüğü → Anafilaksi tanımı!</li>
</ul>
<div class="tbl-wrap"><table>
<thead><tr><th>İlaç</th><th>Doz</th><th>Max</th><th>Not</th></tr></thead>
<tbody>
<tr><td>Setirizin (2. kuş.)</td><td>&lt;2y: 2.5 mg/gün; 2-6y: 5 mg/gün; &gt;6y: 10 mg/gün</td><td>10 mg/gün</td><td>Az sedasyon</td></tr>
<tr><td>Loratadin (2. kuş.)</td><td>2-5y: 5 mg/gün; &gt;5y: 10 mg/gün</td><td>10 mg/gün</td><td>Non-sedatif</td></tr>
<tr><td>Difenhidramin (1. kuş.)</td><td>1.25 mg/kg/doz, 4-6 sa</td><td>50 mg/doz</td><td>Sedasyon, akut</td></tr>
</tbody>
</table></div>
<div class="info-box"><strong>Herediter anjiyoödem:</strong> C1 esteraz inhibitör eksikliği. Adrenaline yanıt ZOR. Bradikinin kaynaklı. Tedavi: C1-INH konsantresi, ikatiband, traneksamik asit</div>
`},{id:45,cat:'hemat',priority:1,title:'Nöroblastom',tags:'nöroblastom,NSE,MIBG,rozet,abdominal,adrenal,Homer-Wright',content:`
<ul>
<li>En sık ekstrakranial solid tümör. Sempatik sinir kökenli. Median 2 yaş. %65 abdominal (adrenal)</li>
<li>Markerlar: <strong>NSE↑ (en spesifik!), LDH↑, ferritin↑, İDRAR VMA/HVA↑</strong></li>
<li>Kİ: <strong>HOMER-WRIGHT PSÖDOROZET formasyonları!</strong> (Mukaddes soruyor)</li>
<li>Görüntüleme: MIBG sintigrafisi</li>
<li>Stage 4S (&lt;1 yaş): Spontan regresyon olabilir</li>
</ul>
<p><strong>Klinik Bulgular:</strong></p>
<ul>
<li><strong>Abdominal kitle:</strong> Sert, düzensiz, orta hattı geçebilir (<em>Wilms'ten farkı: Wilms yumuşak, orta hattı geçmez</em>)</li>
<li><strong>Metastaz bulguları:</strong> <em>"Rakun gözleri"</em> (periorbital ekimoz — kemik metastazı!), subkutan mavi nodüller ("&lt;1 yaş 4S")</li>
<li>Hipertansiyon (katekolamin salgısı), ishal (VIP salgısı)</li>
<li>Horner sendromu (servikal tümör → ptosis, miyozis, anhidroz)</li>
<li><strong>Opsoklonus-miyoklonus-ataksi:</strong> Paraneoplastik ("dans eden gözler")</li>
</ul>
<p><strong>Evreleme (INRG):</strong></p>
<ul>
<li>L1: Lokalize, cerrahi-alan risk faktörü yok</li>
<li>L2: Lokalize, risk faktörü var</li>
<li>M: Metastatik (%65 tanı anında!)</li>
<li>MS: &lt;18 ay, M spesifik (4S karşılığı)</li>
</ul>
<p><strong>Prognostik faktörler:</strong></p>
<ul>
<li><strong>N-MYC amplifikasyonu:</strong> Kötü prognoz!</li>
<li>ALK mutasyonu, 1p delesyonu, 11q delesyonu: Kötü</li>
<li>Triploid: İyi prognoz</li>
</ul>
<div class="pearl">NSE ve rozet formasyonunu MUTLAKA söyle! (Mukaddes)</div>

`},{id:47,cat:'hemat',priority:2,title:'LAP + Lösemi + TLS',tags:'LAP,lösemi,TLS,tümör lizis,hiperürisemi,rasburikaz,allopürinol',content:`
<p><strong>Patolojik LAP Kriterleri:</strong></p>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Benign</th><th>Malign</th></tr></thead>
<tbody>
<tr><td>Boyut</td><td>&lt;2 cm</td><td>&gt;2-3 cm ve büyüyor</td></tr>
<tr><td>Kıvam</td><td>Yumuşak/elastik</td><td>Sert/kauçuğumsu</td></tr>
<tr><td>Mobilite</td><td>Mobil</td><td>FİKSE, matted</td></tr>
<tr><td>Ağrı</td><td>Ağrılı (akut enfeksiyon)</td><td>AĞRISIZ</td></tr>
<tr><td>Lokalizasyon</td><td>Servikal (reaktif)</td><td><strong>SUPRAKLAVİKÜLAR! HER ZAMAN ALARM!</strong></td></tr>
</tbody>
</table></div>
<p><strong>TLS (En sık ALL ve Burkitt):</strong> Kemoterapi başlangıcından 12-72 sa. <strong>4K: HiperÜrisemi, HiperPotasemi, HiperFosfatemi, HipoKalsemi</strong></p>
<ul>
<li>Hiperürisemi → ürat nefropatisi → ABY</li>
<li>Hiperpotasemi → kardiyak aritmi!</li>
<li>Hiperfosfatemi → Ca-fosfat çökmesi → hipokalsemi → tetani</li>
<li>Tedavi: ①Agresif IV hidrasyon ②Allopürinol VEYA <strong>Rasburikaz</strong> (çok hızlı!) ③Hiperpotasemi tedavisi ④Refrakter → diyaliz</li>
</ul>
<h4 class="h-section">🩺 LAP Biyopsi Endikasyonları (Embiya soruyor!)</h4>
<ul>
<li>Boyut &gt;2-3 cm + büyüyor</li>
<li><strong>Supraklaviküler lokalizasyon</strong> (HER ZAMAN biyopsi!)</li>
<li>4 hf antibiyotikten sonra küçülmüyor</li>
<li>Sert, fikse, ağrısız</li>
<li>B semptomları: Ateş, gece terlemesi, kilo kaybı</li>
<li>Hepatosplenomegali eşlik ediyor</li>
<li>Hemogram anormalliği</li>
</ul>
<div class="info-box"><strong>LAP + ateş + HSM + peteşi/purpura → Lösemi düşün!</strong> (Embiya hoca bu dört bulguyu bekliyor)</div>

<h4 class="h-section">💙 Siyanotik Spell (Fallot — Embiya Dilber soruyor!)</h4>
<ul>
<li>Görüldüğü hastalık: <strong>Fallot Tetralojisi</strong> (ağlama, beslenme, defekasyon sırasında)</li>
<li>Mekanizma: Pulmoner vasküler direncin SVR'yi geçmesi → sağdan sola şant artışı</li>
</ul>
<p><strong>Tedavi (sırasıyla):</strong></p>
<ol class="content" style="padding-left:18px">
<li>Diz-göğüs pozisyonu (knee-chest) → SVR artırır → pulmoner akım artar</li>
<li>%100 O₂ → pulmoner vazodilatasyonu destekler</li>
<li>IV sıvı bolus</li>
<li>Morfin 0.1-0.2 mg/kg IV/SC → solunum merkezini yatıştırır, infundibüler spazm azalır</li>
<li>NaHCO₃ 1-2 mEq/kg IV → asidozu düzelt</li>
<li>Beta-blokör (Propranolol) 0.1-0.2 mg/kg IV → infundibüler spazm↓</li>
<li>Fenilefrin (refrakter) → SVR↑</li>
</ol>
`},{id:48,cat:'strateji',priority:4,title:'Kurtarma Soruları — Hocaya Göre',tags:'kurtarma,sınav,hoca,Yakup,Embiya,Erol,Beril,Ali,Mukaddes,Gökçe,Filiz,Burcu,Elif',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Hoca</th><th>Karakteristik Soruları / Beklentileri</th></tr></thead>
<tbody>
<tr><td><strong>Yakup Aslan</strong></td><td>Na↓+K↑+Glukoz↓ → KAH (BIRAKIRIM diyor!) • İyonize Ca bak (total yanıltıcı!) • ABO/Rh uyuşmazlığı • Mukoza → ağız içi+sklera • KDZ → göğüsten • ESR = Erythrocyte Sedimentation Rate</td></tr>
<tr><td><strong>Embiya Dilber</strong></td><td>Dehidrasyon ilk adım = 20 mL/kg SF bolus • Hiperpotasemi sırası: Ca Glukonat→İnsülin+Dex→Salbutamol→NaHCO₃ • DKA glukoz sınırı neden 200 • Fallot hipoksik spell tedavisi • DOZLARI EZBERLE</td></tr>
<tr><td><strong>Erol Erduran</strong></td><td>Digoksin toks. en sık neden = Hipokalemi • Digoksin + IV Ca = KESİN KONTRENDİKE (stone heart!) • K vit eksikliği → PT kontrolü 4 SAAT sonra • KKY'de en erken = taşikardi + pulsus alternans • HÜS'te AB verilmez (Stx↑)</td></tr>
<tr><td><strong>Beril Dilber</strong></td><td>Status protokolü (ABC→KŞ→Benzo→Fenitoin YAVAŞ→Fenobarbital) • Status en düzeltilebilir neden = Hipoglisemi • GBS vs TM farkı • GBS'de steroid ZARAR VERİR</td></tr>
<tr><td><strong>Ali Cansu</strong></td><td>GBS vs TM → TM'de seviye veren duyu kaybı+mesane • Menenjit &lt;1 yaş = fontanel bombesi • SP'den uzaklaştıran = aile öyküsü+progresif kötüleşme • SIRS 4 kriterden 2'si • Serebellar bulgular (11 madde)</td></tr>
<tr><td><strong>Gül Şalcı</strong></td><td>Enürezis → alarm 1. tercih (%65-75) • Desmopressin relaps %60-70, su kısıtla! • İmipramin kardiyotoksik! • Status dozlarını tam say</td></tr>
<tr><td><strong>Mukaddes Kalyoncu</strong></td><td>KKK 9. aya eklendi! • Metabolik hastalık 6 bulgusu • Hipertiroidi+TSH adenomu • Kağıtta yazan cevabı ver, ekstra söyleme → eksi!</td></tr>
<tr><td><strong>Gökçe Pınar</strong></td><td>İTP'de PY → BİR ŞEY GÖRMEZSİNİZ! (dev trombosit olabilir, blast varsa lösemi) • Steroid YE ETKİLERİ: Cushing, osteoporoz, büyüme geriliği, immünosüpresyon</td></tr>
<tr><td><strong>Emine Ayça</strong></td><td>Topuk kanı 6 hastalık: FKÜ, K.Hipotiroidi, Biyotinidaz, KF(IRT), KAH(17-OHP), Hemoglobinopatiler • Önemli noktaları atlamayın yeter</td></tr>
<tr><td><strong>Filiz Aktürk</strong></td><td>Öksürük+ateş ön tanıları (ateşli olanları say!) • YD baş travması: Kaput→sütür geçer, Sefal→sütürde durur, Subgaleal→hayati tehdit • Hipomagnezemi semptomlu → IV Mg SO₄ • Sistematik say, her adımı söyle</td></tr>
<tr><td><strong>Fevziye Başkan</strong></td><td>Uzamış sarılık: İndirekt→anne sütü/hipotiroidi; Direkt→bilyer atrezi (Kasai &lt;60 günde!) • İYE gram(+) eşiği = 2×10⁴</td></tr>
<tr><td><strong>Mustafa İmamoğlu</strong></td><td>4 günlük bebek ateşi ilk 2 ön tanı söylenmezse 0 puan → Dehidratasyon + Sepsis!</td></tr>
<tr><td><strong>Burcu Güven</strong></td><td>Tekrarlayan AC enfeksiyonu nedenleri: İmmün yetmezlik, KF, PCD, KKH, VUR, yabancı cisim, astım, GÖR • İpucu veriyor</td></tr>
<tr><td><strong>Merve Kişioğlu</strong></td><td>Septik şokta güncel sıvı = Ringer Laktat • Aşı takvim değişikliklerini biliyor mu diye soruyor</td></tr>
<tr><td><strong>Elif Bahat</strong></td><td>Nefrotik+steroid → TB dışla! • Artrit etiyolojisi grupla (travma/enfeksiyon/romato/hemato/malignite) • Ödemli çocuk: nefrotik/nefritik/kardiyak/karaciğer</td></tr>
<tr><td><strong>Sevim Şahin</strong></td><td>GBS vs TM → TM'de seviye veren duyu kaybı söyle! • Nörolojik muayene basamakları</td></tr>
<tr><td><strong>Fazıl Orhan</strong></td><td>Patogenez soruyor (ürtiker, Fallot, pnömoni) • FM bulguları + grafi yorumu • Kendi sorularını çekmemeye çalışın!</td></tr>
</tbody>
</table></div>
`},{id:49,cat:'strateji',priority:4,title:'Sınav Stratejisi ve İşleyişi',tags:'strateji,sınav,format,altın kurallar,OTÖ',content:`
<p><strong>Sınav Formatı:</strong></p>
<ul>
<li>3-4 kişi odaya girer, liste sırasına göre</li>
<li>Ortadaki A4 kağıtlardan soru çekilir</li>
<li>Genelde 2 soru: 1 OTÖ tarzı + 1 hocanın kendi sorusu</li>
<li>Kurtarma sorusu: geçme/kalma sınırında belirleyici</li>
</ul>
<p><strong>12 Altın Kural:</strong></p>
<ol class="content" style="padding-left:18px">
<li>Teorik sınavdan en az <strong>70+</strong> alın</li>
<li>OTÖ sorularını birebir çalışın</li>
<li>Sistematik: Ön tanılar → Öykü → FM → Lab → Ayırıcı → Tedavi</li>
<li>Tedavi dozlarını ezberleyin (Embiya, Yakup)</li>
<li>Kurtarma sorularını ÇOK İYİ bilin</li>
<li>Kağıtta yazanı söyleyin (Mukaddes, Filiz) — ekstra söylemeyin</li>
<li>GBS vs TM her döngüde soruluyor</li>
<li>Hemogram yorumlama, PY, MCV'ye göre anemiler</li>
<li>Mukaddes: Seminer Odasında sınav, geç kalmayın</li>
<li>Pratiklere katılın (Yakup, Mustafa İmamoğlu)</li>
<li>Soruyu okuyan hoca ikinci kez OKUMAYABILIR — iyi dinleyin</li>
<li>Bilmediğini sallamayın — Mukaddes soru herkese döner</li>
</ol>
<h4 class="h-section">📋 Sınav Akışı</h4>
<ol class="content" style="padding-left:18px">
<li>Konu çek → <strong>1 dk okuma süresi</strong> → zihinsel hazırlık</li>
<li>Sistematik yanıt: <strong>Etyoloji → Klinik → Tanı → Tedavi → Komplikasyon</strong></li>
<li>Kurtarma sorusu sorulursa: Kısa, net, ezbere cevap ver</li>
<li>"Bilmiyorum" DEME → "şüphe edilecek durumlar şunlardır..." diyerek çerçevele</li>
</ol>
<div class="info-box"><strong>Her soruyu bitirmek için şablon:</strong> ①Neden (etyoloji/patofizyoloji) ②Ne görürüz (klinik) ③Nasıl tanırız (lab/görüntüleme) ④Ne yaparız (tedavi + dozlar) ⑤Ne olabilir (komplikasyon)</div>
<h4 class="h-section">📋 Yeni Hoca Taktikleri (3. Döngü PDF'den)</h4>
<ul>
<li><strong>Ön tanı sorusunda:</strong> Ateşle birlikte olanları say (sadece semptom yapanları değil)</li>
<li><strong>Elektrolit sorusunda:</strong> Hepsini ayrı ayrı say — "elektrolitler" deme, Na, K, Ca, Mg, P de!</li>
<li><strong>Serebral palsi sorularında:</strong> SP'den uzaklaştıran bulgu = aile/kardeş öyküsü + progresif kötüleşme</li>
<li><strong>Muhakkak söyle:</strong> Böbrek üstü bezi yetmezliği (Na↓+K↑+glukoz↓)</li>
<li><strong>İyonize kalsiyum:</strong> Kan gazından bak (total Ca bekletemezsin)</li>
<li><strong>Pediatrik üçgen + ABCDE</strong> → ikisini birlikte kullan</li>
<li><strong>Mukaddes hocada:</strong> Soruyu tekrar okumuyor — iyi dinle, lab değerlerini okuduğu sırada normal mi anla</li>
<li><strong>Bilmiyorsanız:</strong> Mukaddes hocaya sallamayın — ordan sormaya başlıyor</li>
</ul>
`},{id:50,cat:'kardiyoloji',priority:3,title:'Konjenital Kalp Hastalıkları — Siyanotik + Asiyanotik',tags:'KKH,Fallot,TGA,siyanotik,asiyanotik,VSD,ASD,PDA,hipoksik spell,koarktasyon',content:`
<h4 class="h-section">🔵 Siyanotik KKH — Sağ→Sol Şant / Mixing</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Hastalık</th><th>Anatomi / Mekanizma</th><th>Anahtar Özellik</th></tr></thead>
<tbody>
<tr><td><strong>Fallot Tetralojisi (en sık siyanotik!)</strong></td><td>①VSD ②RVOTO (infundibuler stenoz) ③Binici aorta ④RVH → R→L şant</td><td>Siyanoz + hipoksik spell. EKG: RAD+RVH. Grafi: tahta pabuç kalp (coeur en sabot)</td></tr>
<tr><td><strong>TGA (Transpozisyon)</strong></td><td>Aorta RV'den, PA LV'den çıkıyor → 2 paralel dolaşım</td><td>Doğumda ağır siyanoz. DUKTUS BAĞIMLI → PGE₁ hemen! Balon septostomi (Rashkind). En acil KKH!</td></tr>
<tr><td><strong>Triküspid Atrezisi</strong></td><td>Triküspid kapak yok → RV hipoplazisi. ASD + VSD zorunlu</td><td>Siyanoz + RAD yok (aksine LAD). Tek ventrikül fizyolojisi</td></tr>
<tr><td><strong>TAPVD</strong></td><td>Pulmoner venler sol atriyuma dönmez → sağ kalbe dönüyor. ASD zorunlu</td><td>Ağır siyanoz + pulmoner ödem. "Kardan adam" kalp grafisi (suprakardiyak tip)</td></tr>
<tr><td><strong>Hipoplastik Sol Kalp</strong></td><td>LV, mitral/aortik kapaklar hipoplastik → duktus bağımlı sistemik</td><td>Doğumda düzelmiş görünür → duktus kapanınca kritik şok. PGE₁ hayat kurtarır!</td></tr>
<tr><td><strong>Truncus Arteriosus</strong></td><td>Tek büyük arter çıkışı → aorta+PA ayrışmamış</td><td>Erken KKY + siyanoz. VSD ile birlikte</td></tr>
</tbody>
</table></div>
<div class="danger-box"><strong>Duktal bağımlı siyanotik KKH:</strong> TGA, Hipoplastik Sol Kalp, Pulmoner Atrezi → Duktus kapanınca kritik! → <strong>PGE₁ (Prostaglandin E₁) hemen başla!</strong></div>

<h4 class="h-section">❤️ Fallot Tetralojisi — Detay</h4>
<ul>
<li><strong>4 bileşen:</strong> VSD + Sağ ventrikül çıkış yolu obstrüksiyonu (RVOTO) + Binici aorta + Sağ ventrikül hipertrofisi</li>
<li>Siyanoz şiddeti RVOTO şiddetine bağlı (hafif stenoz → az siyanoz, ağır → ağır siyanoz)</li>
<li><strong>Paradoks:</strong> Pulmoner stenoz arttıkça üfürüm AZALIR (kan akımı azalır)!</li>
<li>EKG: Sağ aks sapması (RAD) + Sağ ventrikül hipertrofisi (RVH)</li>
<li>Grafi: Tahta pabuç kalp (coeur en sabot) — pulmoner ark küçük, RVH nedeniyle kalp yukarı kalkmış</li>
</ul>
<div class="step"><div class="step-num">!</div><div class="step-body"><strong>Hipoksik Spell (TET spell) Tedavisi — sırayla:</strong><br>① Diz-göğüs pozisyonu (SVR↑ → R→L şant↓) ② %100 O₂ ③ IV sıvı bolus ④ Morfin 0.1-0.2 mg/kg (infundibuler spazm↓) ⑤ NaHCO₃ (asidozu düzelt) ⑥ Propranolol 0.1-0.2 mg/kg IV (infundibüler spazm↓) ⑦ Fenilefrin (refrakter, SVR↑)</div></div>

<h4 class="h-section">🔴 Asiyanotik KKH — Sol→Sağ Şant / Obstrüktif</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Hastalık</th><th>Mekanizma</th><th>Klinik / Anahtar</th></tr></thead>
<tbody>
<tr><td><strong>VSD (en sık KKH!)</strong></td><td>Sol→Sağ şant → pulmoner hipervolemi → KKY</td><td>Holosistolik üfürüm sol alt sternal. Büyük VSD → emmeme, KKY 1-3 ayda. Spontan kapanma %50 (&lt;3 mm)</td></tr>
<tr><td><strong>ASD</strong></td><td>Atriyal septum defekti → Sol→Sağ şant</td><td>Genellikle asemptomatik. S2 sabit çiftleşmesi! Paradoks emboli riski. Ostium secundum en sık</td></tr>
<tr><td><strong>PDA</strong></td><td>Duktus arteriyozus kapanmamış → Aorta→PA → Sol→Sağ</td><td>Prematürede sık! Sürekli "makine üfürümü" sol klavikula altında. İndometazin/İbuprofen → kapanma. Prematüre: spontan kapanma bekle</td></tr>
<tr><td><strong>AVSD</strong></td><td>ASD+VSD+ortak AV kapak → Down sendromu ile %40 birlikte</td><td>Erken KKY. Down sendromlu çocukta mutlaka kardiyoloji</td></tr>
<tr><td><strong>Koarktasyon (CoA)</strong></td><td>Aort darlığı (ligamentum arteriosum bölgesi) → üst ekstremite HT + alt ekstremite nabız↓</td><td>Kollar ile bacaklar arasında nabız farkı! Baş ağrısı+epistaksis. Grafi: kostalar altında çentiklenme (kollateral). Ağır YD: Duktal bağımlı!</td></tr>
<tr><td><strong>Pulmoner Stenoz</strong></td><td>Pulmoner kapak stenozu → RV baskı yükü</td><td>Ejeksiyon klik + sistolik üfürüm 2. sol IKA. Hafif: asemptomatik. Ağır: siyanoz (sağ→sol foramen ovale)</td></tr>
<tr><td><strong>Aort Stenozu</strong></td><td>Aortik kapak stenozu → LV baskı yükü</td><td>Ejeksiyon klik + üfürüm 2. sağ IKA. Ağır: egzersizle senkop/ani ölüm!</td></tr>
</tbody>
</table></div>
<div class="pearl">Eisenmenger Sendromu: Uzun süren Sol→Sağ şant → pulmoner HT → şant tersine döner (Sağ→Sol) → siyanoz. Artık operabl değil!</div>
<div class="info-box"><strong>Üfürüm değerlendirmesi:</strong> Holosistolik = VSD/MR/TR • Ejeksiyon sistolik = PS/AS/ASD • Sürekli = PDA • Diyastolik = AR/MS (patolojik!)</div>
`},{id:51,cat:'nefro',priority:3,title:'Ödemli Çocuğa Yaklaşım',tags:'ödem,nefrotik,nefritik,kardiyak,karaciğer,proteinüri,hematüri,hipoalbüminemi,Elif Bahat',content:`
<div class="warn"><strong>Elif Bahat soruyor!</strong> Ödemli çocukta sistematik gruplandırmayı bekliyor: Nefrotik / Nefritik / Kardiyak / Karaciğer / Beslenme / Diğer</div>
<h4 class="h-section">🔍 Etiyoloji Gruplandırması (Ezberle!)</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Grup</th><th>Etiyoloji</th><th>Anahtar Bulgu</th></tr></thead>
<tbody>
<tr><td><strong>Nefrotik (en sık!)</strong></td><td>Minimal Değişim Hst. (%80 çocuk), FSGS, membranöz</td><td>Proteinüri +++ | Hipoalbüminemi | Hiperlipidemi | Ödem belden aşağı</td></tr>
<tr><td><strong>Nefritik</strong></td><td>Post-streptokokal GN, IgA nefropatisi, SLE</td><td>Hematüri (çay rengi idrar) | HT | Oligüri | Proteinüri (az)</td></tr>
<tr><td><strong>Kardiyak</strong></td><td>KKY, kardiyomiyopati, KKH</td><td>Kardiomegali | Hepatomegali | JVB↑ | Ortopne | S3 galo</td></tr>
<tr><td><strong>Karaciğer</strong></td><td>Siroz, kronik hepatit, Wilson</td><td>Asit + ödem | Sarılık | Palmar eritem | Albumin↓ | PT uzun</td></tr>
<tr><td><strong>Beslenme</strong></td><td>Kwashiorkor, malabsorpsiyon</td><td>Protein malnutrisyon | Albumin↓ | Kas erimesi + ödem (paradoks!)</td></tr>
<tr><td><strong>Diğer</strong></td><td>Anjiyoödem (alerjik), lenfödem, lokal venöz/lenfatik obstr.</td><td>Pitting değil | Ani başlangıç (anjiyoödem)</td></tr>
</tbody>
</table></div>
<h4 class="h-section">📋 Yaklaşım Basamakları</h4>
<div class="step"><div class="step-num">1</div><div class="step-body"><strong>Ödem tipi:</strong> Pitting mi? Yüz tutulumu var mı (nefrotik → sabah yüz ödemi!)? Asit var mı?</div></div>
<div class="step"><div class="step-num">2</div><div class="step-body"><strong>İdrar analizi:</strong> Dipstik → Proteinüri (nefrotik) | Hematüri (nefritik) | Spot idrarda Protein/Kreatinin oranı</div></div>
<div class="step"><div class="step-num">3</div><div class="step-body"><strong>Kan tetkiki:</strong> Albumin, KC fonksiyon, CBC, BUN/Kre, kolesterol, kompleman (C3↓ → nefritik!)</div></div>
<div class="step"><div class="step-num">4</div><div class="step-body"><strong>Kardiyak değerlendirme:</strong> EKO, KVP, karaciğer büyüklüğü</div></div>
<h4 class="h-section">🫧 Nefrotik Sendrom — Özet</h4>
<ul>
<li>Tanı kriterleri: Proteinüri &gt;40 mg/m²/saat (veya sab. spot Prot/Kre &gt;2) + Hipoalbüminemi &lt;2.5 g/dL + Ödem</li>
<li>Çocukta %80 Minimal Değişim Hastalığı → steroid duyarlı</li>
<li>Komplikasyonlar: Hiperkoagülabilite (AT-III kayıplar → tromboz!), enfeksiyon (Ig kaybı → özellikle pnömokok!), hiperlipidemi</li>
<li>Tedavi: Prednizolon 60 mg/m²/gün (max 60 mg) ×4-6 hf → 40 mg/m²/gün (günaşırı) ×4-6 hf</li>
</ul>
<div class="danger-box"><strong>STEROİD BAŞLAMADAN ÖNCE TB DIŞLA!</strong> Tüberkülin testi (TST) zorunlu. İmmünosüpresyon → latent TB aktivasyonu → ölümcül olabilir! (Elif Bahat + Nefrotik hocalarda kritik!)</div>
<h4 class="h-section">🩸 Nefritik Sendrom — Özet</h4>
<ul>
<li>Post-Streptokokal GN: Boğaz/deri GAS enfeksiyonundan 1-3 hafta sonra (boğaz 1-2 hf, deri 3-6 hf)</li>
<li>C3 ↓↓ (4-8 hf sonra normale döner) | ASLO↑ | Anti-DNaz B↑</li>
<li>Tedavi: Destekleyici (sıvı kısıtlama, HT tedavisi, diüretik). AB sadece aktif enfeksiyon varsa</li>
<li>Prognoz: Çocukta genellikle iyi. C3 8 hf sonra normale dönmezse → biyopsi</li>
</ul>
`},{id:52,cat:'enfeksiyon',priority:3,title:'Artritli Çocuğa Yaklaşım + Lupus (SLE)',tags:'artrit,JIA,septik artrit,reaktif artrit,ARA,SLE,lupus,ANÜ,Elif Bahat',content:`
<div class="warn"><strong>Elif Bahat soruyor!</strong> Artrit nedenlerini gruplandırarak saymanızı bekliyor. Lupus'tan steroid başlamadan TB dışlama soruyor!</div>
<h4 class="h-section">🦵 Artrit Etiyolojisi — Gruplandırarak Say!</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Grup</th><th>Etiyoloji</th><th>Anahtar</th></tr></thead>
<tbody>
<tr><td><strong>Travma</strong></td><td>Hemartröz, menisküs, ligaman</td><td>Öykü! Spor aktivitesi</td></tr>
<tr><td><strong>Enfeksiyon</strong></td><td>Septik artrit (S.aureus en sık), reaktif artrit (post-enfeksiyöz), viral (parvovirus, EBV), ARA</td><td>Ateş + tek eklem = septik artrit dışla!</td></tr>
<tr><td><strong>Romatoloji</strong></td><td>JIA, ARA, SLE, vaskülitler (Kawasaki, IgA), PFAPA</td><td>Uzun süreli, sistemik bulgular</td></tr>
<tr><td><strong>Hematoloji</strong></td><td>Hemofili (hemartröz), orak hücre, lösemi</td><td>Periartriküler ağrı → lösemi!!</td></tr>
<tr><td><strong>Malignite</strong></td><td>Lösemi (kemik ağrısı → artrit gibi), kemik tümörleri</td><td>Gece ağrısı + kilo kaybı + LAP</td></tr>
<tr><td><strong>Ortopedik</strong></td><td>Perthes, SCH, Osgood-Schlatter</td><td>Tek eklem, yaşa özgü lokalizasyon</td></tr>
</tbody>
</table></div>
<h4 class="h-section">🦠 Septik Artrit vs Reaktif Artrit</h4>
<div class="tbl-wrap"><table>
<thead><tr><th>Özellik</th><th>Septik Artrit</th><th>Reaktif Artrit</th></tr></thead>
<tbody>
<tr><td>Başlangıç</td><td>Ani, ateş yüksek</td><td>Enfeksiyondan 1-4 hafta sonra</td></tr>
<tr><td>Eklem sayısı</td><td>Tek (monoartriti)</td><td>Birkaç (asimetrik)</td></tr>
<tr><td>Eklem</td><td>Çok sıcak, şiş, ağrılı, hareket YOK</td><td>Daha az dramatik</td></tr>
<tr><td>Lab</td><td>WBC↑↑, ESR↑↑, CRP↑↑ — Eklem sıvısı WBC &gt;50.000</td><td>ESR↑, hafif WBC↑</td></tr>
<tr><td>Tedavi</td><td>ACİL cerrahi drenaj + IV antibiyotik</td><td>NSAİİ, takip</td></tr>
</tbody>
</table></div>
<h4 class="h-section">📋 JIA — Juvenil İdiyopatik Artrit</h4>
<ul>
<li><strong>Oligoartiküler (en sık!):</strong> ≤4 eklem, büyük eklem, ANA(+), <strong>göz muayenesi şart (üveit!)</strong></li>
<li><strong>Poliartriküler:</strong> ≥5 eklem. RF(+) → ağır prognoz</li>
<li><strong>Sistemik (Still):</strong> Günde 2 pik ateş + salmon-pink döküntü + hepatosplenomegali + artrit</li>
<li><strong>Psöriyatik, entezit ilişkili:</strong> HLA-B27(+) formlar sakroiliyak tutabilir</li>
</ul>
<h4 class="h-section">🦋 SLE (Lupus) — Çocukta</h4>
<ul>
<li><strong>SLICC kriterleri (≥4/11):</strong> Butterfly rash, diskoid döküntü, oral ülser, fotosensitivite, saçkırılması, serozit, böbrek (proteinüri &gt;500 mg/gün), nöroloji, hemolitik anemi, lökopeni, trombositopeni, ANÜ(+), Anti-dsDNA(+), Anti-Sm(+)</li>
<li>Laboratuvar: ANÜ (tarama!), Anti-dsDNA (spesifik, hastalık aktivitesi), C3-C4↓, CBC, idrar analizi</li>
<li>Böbrek tutulumu → Lupus nefriti → ACE inhibitörü + steroid + MMF/siklofosfamid</li>
</ul>
<div class="danger-box"><strong>STEROİD BAŞLAMADAN TB DIŞLA!</strong> Lupus + steroid → latent TB aktive olur! TST yap! (Elif Bahat + sıkça sorulan!)</div>
<div class="pearl">Lupus'ta "kelebek döküntü" — nasolabiyal kıvrımları atlar! (Rosacea ile farkı: rosacea kıvrımları tutabilir)</div>
`},{id:53,cat:'alerji',priority:3,title:'Astım Atağı — Sınıflandırma + Tedavi',tags:'astım,salbutamol,ipratropium,SABA,steroid,sessiz göğüs,PEF,nebülizasyon,Filiz,Embiya',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Kriter</th><th>Hafif</th><th>Orta</th><th>Ağır</th><th>İmminant Arrest</th></tr></thead>
<tbody>
<tr><td>Konuşma</td><td>Cümlelerle</td><td>Kelimelerle</td><td>Sadece kelime</td><td>Konuşamıyor</td></tr>
<tr><td>Bilinç</td><td>Uyanık</td><td>Ajite</td><td>Çok ajite</td><td>Letarjik/konfüze</td></tr>
<tr><td>SpO₂</td><td>≥%94</td><td>%91-93</td><td>&lt;%91</td><td>&lt;%91</td></tr>
<tr><td>Hışıltı</td><td>Exp. sonu</td><td>Belirgin</td><td>Exp+İnsp</td><td><strong>SESSİZ GÖĞÜS!</strong></td></tr>
<tr><td>Yardımcı kas</td><td>Yok/minimal</td><td>Var</td><td>Belirgin</td><td>Paradoksal</td></tr>
<tr><td>PEF</td><td>&gt;%70</td><td>%40-70</td><td>&lt;%40</td><td>Ölçülemiyor</td></tr>
</tbody>
</table></div>
<div class="danger-box"><strong>Sessiz göğüs = İMPENDİNG ARREST!</strong> Hava akımı o kadar azalmış ki hışıltı duyulmuyor → HEMEN entübasyon hazırlığı! Paradoksal solunum = solunum kası yorgunluğu → kritik!</div>
<h4 class="h-section">💊 Tedavi Basamakları</h4>
<div class="step"><div class="step-num">1</div><div class="step-body"><strong>Hafif (evde):</strong> Salbutamol inhaler 2-4 puf araseptörle, 20 dk arayla 3 kez. Prednizolon 1-2 mg/kg oral (max 40 mg) 3-5 gün. 1 saat sonra değerlendir.</div></div>
<div class="step"><div class="step-num">2</div><div class="step-body"><strong>Orta (acil):</strong> O₂ (SpO₂ ≥%95 hedef). Salbutamol nebül <strong>0.15 mg/kg</strong> (min 2.5 mg, max 5 mg) 20 dk arayla 3 kez. İpratropium bromür 250 μg (&lt;4 yaş) / 500 μg (≥4 yaş). Prednizolon oral <strong>1-2 mg/kg, max 40 mg</strong>.</div></div>
<div class="step"><div class="step-num">3</div><div class="step-body"><strong>Ağır (acil/yatış):</strong> Sürekli O₂. Salbutamol sürekli nebülizasyon. İpratropium her 20 dk ilk 3 doz. IV Metilprednizolon <strong>1-2 mg/kg IV</strong> (max 60 mg). IV Mg SO₄ <strong>40-50 mg/kg</strong> 20 dk'da (max 2 g — bronkodilatatör!). IV Aminofilin 5-6 mg/kg yükleme. Yanıtsız → YBÜ/entübasyon.</div></div>
<div class="info-box"><strong>Taburculuk kriterleri:</strong> SpO₂ ≥%94 oda havasında + PEF &gt;%70 + klinik stabil → 7 gün sonra kontrol</div>
<div class="pearl"><strong>Öksürük+ateşle gelen çocukta ön tanılar (ATEŞLE birlikte olanları say!):</strong> Bronşiolit (&lt;2 yaş, RSV) • Viral pnömoni (bilateral) • Bakteriyel pnömoni (tek taraf, yüksek ateş) • Astım atağı (wheezing + öykü)</div>
`},{id:54,cat:'enfeksiyon',priority:2,title:'Döküntülü Hastalık Eşleşmesi',tags:'döküntü,peteşi,purpura,Kawasaki,meningokoksemi,ARA,SLE,IgA vasküliti,kızamık,su çiçeği,Elif Bahat',content:`
<div class="tbl-wrap"><table>
<thead><tr><th>Döküntü Tipi</th><th>Hastalıklar</th><th>Ayırt Edici Özellik</th></tr></thead>
<tbody>
<tr><td><strong>Makülopopüler</strong></td><td>Kızamık, kızamıkçık, EBV, ilaç reaksiyonu, Kawasaki, roseola</td><td>EBV+ampisilin → döküntü PATLAR! Kızamık: Koplik lekeleri (bukkal mukoza)</td></tr>
<tr><td><strong>Veziküler</strong></td><td>Su çiçeği, HSV, el-ayak-ağız hastalığı, zona</td><td>Su çiçeği: farklı evrelerde lezyon (makül+vezikül+kabuk aynı anda). El-ayak-ağız: Coxsackie A16</td></tr>
<tr><td><strong>Peteşi/Purpura (SOLMAZ!)</strong></td><td><strong>MEMNİNGOKOKSEMİ(!), İTP, lösemi, DIC, IgA vasküliti, vaskülit</strong></td><td>Peteşi+ateş+bilinç değişikliği = ACİL! Meningokoksemi → 0-12 saatte ölüm olabilir!</td></tr>
<tr><td><strong>Eritema marginatum</strong></td><td>ARA (Akut Romatizmal Ateş)</td><td>Halkamsı, merkezi soluk, gövdede, banyo ile belirginleşir. Majör kriter!</td></tr>
<tr><td><strong>Kelebek döküntü</strong></td><td>SLE (Lupus)</td><td>Nazolabial kıvrımları ATLAR! Rosacea ile karışır (rosacea kıvrımları tutabilir)</td></tr>
<tr><td><strong>Palpabl purpura (alt ext.)</strong></td><td>IgA Vasküliti (Henoch-Schönlein)</td><td>Alt ekstremite + kalça. Triad: purpura+karın ağrısı+artrit. ±Renal tutulum</td></tr>
<tr><td><strong>Çilek dil</strong></td><td>Kızıl, Kawasaki</td><td>Kızıl: boğaz+ateş+perioral solukluk. Kawasaki: ateş≥5 gün+konjonktivit+LAP+el ayak ödem+döküntü</td></tr>
<tr><td><strong>Ash-leaf makül (hipopigmente)</strong></td><td>Tuberoskleroz</td><td>+epilepsi+kortikal tüberler+şagreen patch. Wood lambası ile görülür</td></tr>
<tr><td><strong>Café au lait</strong></td><td>NF-1 (Nörofibromatozis)</td><td>≥6 adet + Lisch nodülleri (iris hamartom) + nörofibromlar</td></tr>
<tr><td><strong>Periorbital ödem + döküntü</strong></td><td>Juvenil dermatomiyozit, nefrotik sendrom</td><td>Heliotrope döküntü (mor gözkapağı) = dermatomiyozit</td></tr>
</tbody>
</table></div>
<div class="danger-box"><strong>Peteşi + Ateş = MENĠNGOKOKSEMĠ dışlanana kadar acil!</strong> İlk dozu acilde ver, LP bekleme! Tedavi: Seftriakson 100 mg/kg/gün IV</div>
<div class="info-box"><strong>Kawasaki tanı kriterleri (≥5 gün ateş + 4/5 kriter):</strong> ①Konjonktivit (non-pürülan) ②Oral değişiklik (çilek dil, kırmızı dudak, farenjit) ③Döküntü (polimorf) ④El-ayak ödem/eritem/deskuamasyon ⑤Servikal LAP (≥1.5 cm, tek taraflı). Tedavi: IVIG 2 g/kg tek doz + Aspirin</div>
`}
];

function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  document.getElementById('theme-toggle').textContent = isLight ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#1a3585' : '#0a0c14');
}
(function initTheme() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') {
    document.documentElement.classList.add('light');
    document.getElementById('theme-toggle').textContent = '☀️';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a3585');
  }
})();

// ============================================================
// STATE
// ============================================================
const state = {
  bookmarks: new Set(JSON.parse(localStorage.getItem('bookmarks') || '[]')),
  learned: new Set(JSON.parse(localStorage.getItem('learned') || '[]')),
  openCards: new Set(JSON.parse(localStorage.getItem('openCards') || '[]')),
  currentPage: 'home',
  homeFilter: 'all',
  homeCatFilter: 'all',
  allOpen: false
};

function saveState() {
  localStorage.setItem('bookmarks', JSON.stringify([...state.bookmarks]));
  localStorage.setItem('learned', JSON.stringify([...state.learned]));
  localStorage.setItem('openCards', JSON.stringify([...state.openCards]));
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// NAVIGATION
// ============================================================
function navTo(page, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (btn) btn.classList.add('active');
  state.currentPage = page;
  const titles = {
    home: 'KTÜ Pediatri Sınav',
    topics: 'Tüm Konular',
    doses: 'Kritik Dozlar',
    search: 'Arama',
    saved: 'Kaydettiklerim'
  };
  document.getElementById('header-title').textContent = titles[page];
  // Scroll to top
  document.getElementById('main').scrollTo(0, 0);
  if (page === 'saved') renderSaved();
  if (page === 'home') updateStats();
}

// ============================================================
// CARD RENDERING
// ============================================================
function getPriorityBadge(p) {
  const badges = {
    4: '<span class="badge badge-p4">Çok Yüksek</span>',
    3: '<span class="badge badge-p3">Yüksek</span>',
    2: '<span class="badge badge-p2">Orta-Yüksek</span>',
    1: '<span class="badge badge-p1">Orta</span>'
  };
  return badges[p] || '';
}

function renderCard(topic, options = {}) {
  const isOpen = state.openCards.has(topic.id) || options.forceOpen;
  const isBookmarked = state.bookmarks.has(topic.id);
  const isLearned = state.learned.has(topic.id);
  const content = options.highlightFn ? options.highlightFn(topic.content) : topic.content;

  return `<div class="card pc${topic.priority}${isOpen ? ' open' : ''}" id="card-${topic.id}-${options.suffix || 'main'}">
    <div class="card-header" onclick="toggleCard(${topic.id}, '${options.suffix || 'main'}')">
      <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">
        ${isLearned ? '<span class="learned-mark">✓</span>' : ''}
        ${isBookmarked ? '<span class="bookmark-mark">⭐</span>' : ''}
        <span class="card-title">${topic.id}. ${topic.title}</span>
      </div>
      <div class="card-badges">
        ${getPriorityBadge(topic.priority)}
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="card-body">
      <div class="content" style="margin-top:12px;">${content}</div>
      <div class="card-actions">
        <button class="btn-sm btn-bookmark${isBookmarked ? ' active' : ''}" onclick="toggleBookmark(${topic.id},'${options.suffix || 'main'}')">
          ⭐ ${isBookmarked ? 'Kaydedildi' : 'Kaydet'}
        </button>
        <button class="btn-sm btn-learned${isLearned ? ' active' : ''}" onclick="toggleLearned(${topic.id},'${options.suffix || 'main'}')">
          ✓ ${isLearned ? 'Öğrenildi' : 'Öğrendim'}
        </button>
      </div>
    </div>
  </div>`;
}

function toggleCard(id, suffix) {
  suffix = suffix || 'main';
  const card = document.getElementById(`card-${id}-${suffix}`);
  if (!card) return;
  const isOpen = card.classList.contains('open');
  if (isOpen) {
    card.classList.remove('open');
    state.openCards.delete(id);
  } else {
    card.classList.add('open');
    state.openCards.add(id);
  }
  saveState();
}

function toggleBookmark(id, suffix) {
  if (state.bookmarks.has(id)) {
    state.bookmarks.delete(id);
    showToast('Kaydedildi kaldırıldı');
  } else {
    state.bookmarks.add(id);
    showToast('⭐ Kaydedildi!');
  }
  saveState();
  updateStats();
  refreshCardButtons(id, suffix);
}

function toggleLearned(id, suffix) {
  if (state.learned.has(id)) {
    state.learned.delete(id);
    showToast('Öğrenildi kaldırıldı');
  } else {
    state.learned.add(id);
    showToast('✓ Öğrenildi!');
  }
  saveState();
  updateStats();
  refreshCardButtons(id, suffix);
}

function refreshCardButtons(id, suffix) {
  const isBookmarked = state.bookmarks.has(id);
  const isLearned = state.learned.has(id);
  // Update all instances of this card
  document.querySelectorAll(`[id^="card-${id}-"]`).forEach(card => {
    const bmark = card.querySelector('.btn-bookmark');
    const learn = card.querySelector('.btn-learned');
    const lmark = card.querySelector('.learned-mark');
    const bkmark = card.querySelector('.bookmark-mark');
    if (bmark) {
      bmark.classList.toggle('active', isBookmarked);
      bmark.textContent = (isBookmarked ? '⭐ Kaydedildi' : '⭐ Kaydet');
    }
    if (learn) {
      learn.classList.toggle('active', isLearned);
      learn.textContent = (isLearned ? '✓ Öğrenildi' : '✓ Öğrendim');
    }
    const header = card.querySelector('.card-header');
    if (header) {
      if (lmark) lmark.style.display = isLearned ? '' : 'none';
      if (bkmark) bkmark.style.display = isBookmarked ? '' : 'none';
    }
  });
  // If saved page is active, re-render
  if (state.currentPage === 'saved') renderSaved();
}

// ============================================================
// HOME PAGE
// ============================================================
function updateStats() {
  document.getElementById('stat-total').textContent = TOPICS.length;
  document.getElementById('stat-bookmarked').textContent = state.bookmarks.size;
  document.getElementById('stat-learned').textContent = state.learned.size;
  const pct = Math.round((state.learned.size / TOPICS.length) * 100);
  document.getElementById('stat-pct').textContent = '%' + pct;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = state.learned.size + ' / ' + TOPICS.length;
}

function initHomePage() {
  // Category chips
  const catChips = document.getElementById('home-cat-chips');
  catChips.innerHTML = '<div class="chip active" data-cat="all" onclick="setCatFilter(\'all\',this)">Tümü</div>';
  Object.entries(CATEGORIES).forEach(([key, label]) => {
    const hasTopics = TOPICS.some(t => t.cat === key);
    if (hasTopics) {
      catChips.innerHTML += `<div class="chip" data-cat="${key}" onclick="setCatFilter('${key}',this)">${label}</div>`;
    }
  });

  // Priority chips
  document.getElementById('home-priority-chips').querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', function() {
      document.getElementById('home-priority-chips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      this.classList.add('active');
      state.homeFilter = this.dataset.filter;
      renderHomeTopics();
    });
  });

  renderHomeTopics();
  updateStats();
}

function setCatFilter(cat, el) {
  document.getElementById('home-cat-chips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  state.homeCatFilter = cat;
  renderHomeTopics();
}

function renderHomeTopics() {
  let filtered = TOPICS.filter(t => {
    const pMatch = state.homeFilter === 'all' || t.priority === parseInt(state.homeFilter.replace('p',''));
    const cMatch = state.homeCatFilter === 'all' || t.cat === state.homeCatFilter;
    return pMatch && cMatch;
  });

  const container = document.getElementById('home-topics');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">Bu filtreye uygun konu bulunamadı</div>';
    return;
  }
  container.innerHTML = filtered.map(t => renderCard(t, {suffix:'home'})).join('');
}

// ============================================================
// TOPICS PAGE
// ============================================================
function initTopicsPage() {
  const container = document.getElementById('topics-list');
  let html = '';
  Object.entries(CATEGORIES).forEach(([key, label]) => {
    const catTopics = TOPICS.filter(t => t.cat === key);
    if (catTopics.length === 0) return;
    html += `<div class="cat-header">${label}</div>`;
    html += catTopics.map(t => renderCard(t, {suffix:'topics'})).join('');
  });
  container.innerHTML = html;
}

function toggleAllCards() {
  state.allOpen = !state.allOpen;
  const btn = document.getElementById('toggle-all-btn');
  btn.textContent = state.allOpen ? 'Tümünü Kapat' : 'Tümünü Aç';

  TOPICS.forEach(t => {
    const card = document.getElementById(`card-${t.id}-topics`);
    if (!card) return;
    if (state.allOpen) {
      card.classList.add('open');
      state.openCards.add(t.id);
    } else {
      card.classList.remove('open');
      state.openCards.delete(t.id);
    }
  });
  saveState();
}

// ============================================================
// DOSES PAGE
// ============================================================
function initDosesPage() {
  const grid = document.getElementById('doses-grid');
  grid.innerHTML = DOSE_GROUPS.map(g => `
    <div class="dose-card">
      <h4>${g.icon} ${g.title}</h4>
      ${g.items.map(i => `
        <div class="dose-item">
          <div class="dose-name">${i.name}</div>
          <div class="dose-val">${i.dose}</div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ============================================================
// SEARCH PAGE
// ============================================================
let searchDebounce;
function initSearchPage() {
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');

  input.addEventListener('input', function() {
    clearBtn.classList.toggle('visible', this.value.length > 0);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => doSearch(this.value), 200);
  });
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('search-clear').classList.remove('visible');
  document.getElementById('search-results').innerHTML = '';
}

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, query) {
  if (!query) return text;
  const re = new RegExp(`(${escapeRegex(query)})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function stripHtml(html) {
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}

function doSearch(q) {
  const container = document.getElementById('search-results');
  q = q.trim();
  if (q.length < 2) {
    container.innerHTML = q.length === 0
      ? '<div class="empty"><div class="empty-icon">🔍</div><p>Arama yapmak için yazmaya başlayın</p></div>'
      : '';
    return;
  }

  const lower = q.toLowerCase();
  const results = TOPICS.filter(t => {
    const searchable = (t.title + ' ' + t.tags + ' ' + stripHtml(t.content)).toLowerCase();
    return searchable.includes(lower);
  });

  if (results.length === 0) {
    container.innerHTML = `<div class="no-results">Sonuç bulunamadı: "<strong>${q}</strong>"</div>`;
    return;
  }

  container.innerHTML = `<div style="font-size:13px;color:var(--text2);margin-bottom:10px;">${results.length} sonuç bulundu</div>` +
    results.map(t => {
      const hl = (text) => highlight(text, q);
      return renderCard(t, {suffix:'search', forceOpen:true, highlightFn:(content) => highlight(content, q)});
    }).join('');

  // Also highlight titles
  container.querySelectorAll('.card-title').forEach(el => {
    el.innerHTML = highlight(el.textContent, q);
  });
}

// ============================================================
// SAVED PAGE
// ============================================================
function renderSaved() {
  const container = document.getElementById('saved-list');
  const saved = TOPICS.filter(t => state.bookmarks.has(t.id));
  if (saved.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">⭐</div><p>Henüz kaydettiğiniz konu yok.<br>Konu kartlarında ⭐ Kaydet butonuna basın.</p></div>';
    return;
  }
  container.innerHTML = saved.map(t => renderCard(t, {suffix:'saved'})).join('');
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  initHomePage();
  initTopicsPage();
  initDosesPage();
  initSearchPage();
  updateStats();
});
</script>
</body>
</html>
